<style>
/* ============================================================
   ALIEN MARKUP — retrofuture CRT console
   ============================================================ */
:root{
  --font:"Berkeley Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --toon:"Comic Sans MS","Chalkboard SE","Comic Neue",var(--font);
  --edge:#000;
  --pad:14px;
  --err:#ff5f56;
  --warn:#ffb648;
  --glow:6px; --scan:.22; --vig:.55; --gridsize:34px;
  --code:14px;
}

/* ALIEN — фосфорный ЭЛТ */
html[data-theme="alien"]{
  --bg:#070b09; --bg-2:#0b120e; --panel:#0a100d;
  --ph:#4dffa6; --ph-dim:#1f7a53; --ph-ghost:#0f2a20;
  --a2:#ffb648; --led:#4dffa6; --grid:rgba(77,255,166,.07);
}
/* VAULT — янтарный терминал убежища */
html[data-theme="vault"]{
  --bg:#0a0704; --bg-2:#120d07; --panel:#100b06;
  --ph:#ffb648; --ph-dim:#8a5c15; --ph-ghost:#2a1e08;
  --a2:#7dff9b; --led:#ffb648; --grid:rgba(255,182,72,.07);
  --glow:7px; --scan:.25; --vig:.6;
}
/* SOLARIS — холодная станция */
html[data-theme="solaris"]{
  --bg:#050a0d; --bg-2:#081116; --panel:#070f14;
  --ph:#7ad7ff; --ph-dim:#2a6e8c; --ph-ghost:#0c2530;
  --a2:#d8f2ff; --led:#7ad7ff; --grid:rgba(122,215,255,.07);
  --glow:5px; --scan:.18; --vig:.5;
}
/* REPLICANT — неоновый нуар */
html[data-theme="replicant"]{
  --bg:#0a0714; --bg-2:#0f0a1c; --panel:#0c0818;
  --ph:#22d3ee; --ph-dim:#4a3a7a; --ph-ghost:#1a1230;
  --a2:#ff2e88; --led:#ff2e88; --grid:rgba(255,46,136,.06);
  --glow:11px; --scan:.12; --vig:.62; --gridsize:44px;
}
/* GRID — световая сетка */
html[data-theme="grid"]{
  --bg:#000306; --bg-2:#03080c; --panel:#02060a;
  --ph:#00e5ff; --ph-dim:#0d5f75; --ph-ghost:#04212b;
  --a2:#ff8a00; --led:#ff8a00; --grid:rgba(0,229,255,.09);
  --glow:9px; --scan:.08; --vig:.5; --gridsize:28px;
}
/* ZION — цифровой дождь */
html[data-theme="zion"]{
  --bg:#000600; --bg-2:#020a02; --panel:#010801;
  --ph:#00ff41; --ph-dim:#0a6b1e; --ph-ghost:#04220a;
  --a2:#d4ffd4; --led:#00ff41; --grid:rgba(0,255,65,.05);
  --glow:8px; --scan:.3; --vig:.6;
}
/* MONOLITH — светлая, дневная */
html[data-theme="monolith"]{
  --bg:#eceae4; --bg-2:#f6f5f2; --panel:#f6f5f2;
  --ph:#16150f; --ph-dim:#a8a498; --ph-ghost:#dedbd2;
  --a2:#e8341c; --led:#e8341c; --grid:rgba(22,21,15,.05);
  --glow:0px; --scan:.045; --vig:.08;
}
html[data-theme="monolith"] #app{animation:none}
html[data-theme="monolith"] #crt::before{mix-blend-mode:normal}

/* --- спокойные --- */
/* BONE — тёплая бумага */
html[data-theme="bone"]{
  --bg:#f7f6f2; --bg-2:#fffdf9; --panel:#fffdf9;
  --ph:#262420; --ph-dim:#b3ada0; --ph-ghost:#e9e6de;
  --a2:#b4593c; --led:#b4593c; --grid:rgba(38,36,32,.035);
  --glow:0px; --scan:0; --vig:.05;
}
/* FOG — холодная студийная */
html[data-theme="fog"]{
  --bg:#f3f6f9; --bg-2:#ffffff; --panel:#ffffff;
  --ph:#1a2027; --ph-dim:#aab4c0; --ph-ghost:#e3e9f0;
  --a2:#3f5fd7; --led:#3f5fd7; --grid:rgba(26,32,39,.03);
  --glow:0px; --scan:0; --vig:.04;
}
/* GRAPHITE — мягкая тёмная */
html[data-theme="graphite"]{
  --bg:#15181c; --bg-2:#1b1f24; --panel:#191c21;
  --ph:#d9dee5; --ph-dim:#5c656f; --ph-ghost:#252b32;
  --a2:#7fb3ff; --led:#7fb3ff; --grid:rgba(217,222,229,.028);
  --glow:0px; --scan:.05; --vig:.25;
}
/* --- мультяшные --- */
/* PORTAL — кислотная зелень на фиолетовом */
html[data-theme="portal"]{
  --bg:#120826; --bg-2:#1a0f33; --panel:#160b2c;
  --ph:#a8e04a; --ph-dim:#5a7a2e; --ph-ghost:#241442;
  --a2:#2ee6d6; --led:#a8e04a; --grid:rgba(168,224,74,.06);
  --edge:#050a02; --glow:12px; --scan:.2; --vig:.55;
}
/* SLIME — светлый комикс с чёрными контурами */
html[data-theme="slime"]{
  --bg:#fdf7e4; --bg-2:#fffdf3; --panel:#fffdf3;
  --ph:#141414; --ph-dim:#2a2a24; --ph-ghost:#efe7cd;
  --a2:#7ec636; --led:#7ec636; --grid:rgba(20,20,20,.05);
  --edge:#141414; --glow:0px; --scan:0; --vig:.06;
  --err:#d62f86; --warn:#e8a020;
}
/* STATIC — фуксия с лаймом и помехами */
html[data-theme="static"]{
  --bg:#0d0217; --bg-2:#16042a; --panel:#120321;
  --ph:#ff63d1; --ph-dim:#7a2e63; --ph-ghost:#26093f;
  --a2:#c7ff2e; --led:#ff63d1; --grid:rgba(255,99,209,.05);
  --edge:#000000; --glow:10px; --scan:.26; --vig:.6;
}

/* --- пластика: спокойные темы --- */
html[data-skin="calm"] #app{animation:none}
html[data-skin="calm"] #crt::before{mix-blend-mode:normal}
html[data-skin="calm"] header,
html[data-skin="calm"] .toolbar,
html[data-skin="calm"] .pane-head,
html[data-skin="calm"] footer,
html[data-skin="calm"] .menu,
html[data-skin="calm"] #toast{font-family:var(--ui); letter-spacing:.02em}
html[data-skin="calm"] button,
html[data-skin="calm"] select,
html[data-skin="calm"] .seg,
html[data-skin="calm"] .tgl,
html[data-skin="calm"] .tgl .box{border-radius:8px}
html[data-skin="calm"] .seg span:first-child{border-radius:7px 0 0 7px}
html[data-skin="calm"] .seg span:last-child{border-radius:0 7px 7px 0}
html[data-skin="calm"] button:hover,
html[data-skin="calm"] .seg span:hover{box-shadow:none; background:var(--ph-ghost)}
html[data-skin="calm"] button.primary{box-shadow:none}
html[data-skin="calm"] .menu{border-radius:10px; border-color:var(--ph-ghost); box-shadow:0 10px 28px rgba(0,0,0,.14)}
html[data-skin="calm"] .pane-head .dot{box-shadow:none}
html[data-skin="calm"] .led b{box-shadow:none; animation:none}

/* --- пластика: мультяшные темы --- */
html[data-skin="toon"] .brand h1{font-family:var(--toon); letter-spacing:.02em}
html[data-skin="toon"] button,
html[data-skin="toon"] select,
html[data-skin="toon"] .seg,
html[data-skin="toon"] .tgl{border-width:2px; border-radius:10px}
html[data-skin="toon"] .tgl .box{border-width:2px; border-radius:5px}
html[data-skin="toon"] button{box-shadow:2px 2px 0 var(--edge)}
html[data-skin="toon"] button:hover{box-shadow:3px 3px 0 var(--edge)}
html[data-skin="toon"] button:active{transform:translate(2px,2px); box-shadow:none}
html[data-skin="toon"] .menu{border-width:2px; border-radius:12px; box-shadow:4px 4px 0 var(--edge)}
html[data-theme="slime"] #app{animation:none}
html[data-theme="slime"] #crt::before{mix-blend-mode:normal}

/* портальная воронка (тема portal) */
#portal{
  position:fixed; inset:0; z-index:97; pointer-events:none; opacity:0;
  transition:opacity .6s linear;
  background:conic-gradient(from 0deg at 50% 50%,
    rgba(168,224,74,.30), rgba(46,230,214,.06) 25%,
    rgba(168,224,74,.30) 50%, rgba(46,230,214,.06) 75%, rgba(168,224,74,.30));
  -webkit-mask:radial-gradient(circle at 50% 50%, transparent 0 14%, #000 22% 36%, transparent 48%);
  mask:radial-gradient(circle at 50% 50%, transparent 0 14%, #000 22% 36%, transparent 48%);
}
html[data-theme="portal"] #portal{opacity:.9; animation:swirl 30s linear infinite}
@keyframes swirl{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* помехи (тема static) */
@keyframes glitch{
  0%,90%,100%{transform:translate(0,0)}
  91%{transform:translate(-2px,1px)}
  92%{transform:translate(2px,-1px)}
  93%{transform:translate(-1px,0)}
  94%{transform:translate(0,0)}
}
html[data-theme="static"] #app{animation:glitch 6s infinite steps(1,end)}
@media (prefers-reduced-motion: reduce){
  html[data-theme="portal"] #portal{animation:none}
  html[data-theme="static"] #app{animation:none}
}


*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ph);
  font-family:var(--font); font-size:16px; line-height:1.5;
  overflow:hidden;
  text-shadow:0 0 var(--glow) color-mix(in srgb, var(--ph) 35%, transparent);
  transition:background .25s linear, color .25s linear;
}

/* --- CRT overlays --- */
#crt{position:fixed; inset:0; pointer-events:none; z-index:99}
#crt::before{ /* scanlines */
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0 2px, rgba(0,0,0,var(--scan)) 2px 3px);
  mix-blend-mode:multiply;
}
#crt::after{ /* vignette + glass */
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,var(--vig)) 100%),
    linear-gradient(120deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 40%);
}
#rain{
  position:fixed; inset:0; z-index:98; pointer-events:none;
  opacity:0; transition:opacity .5s linear; mix-blend-mode:screen;
}
html[data-theme="zion"] #rain{opacity:.16}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.965}99%{opacity:.985}}
#app{animation:flick 7s infinite steps(1,end)}

/* --- layout --- */
#app{height:100%; display:flex; flex-direction:column; position:relative; z-index:1;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--gridsize) var(--gridsize);
}

header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:12px 20px; border-bottom:1px solid var(--ph-dim);
  background:linear-gradient(180deg, var(--bg-2), transparent);
}
.brand{display:flex; align-items:baseline; gap:12px}
.brand h1{
  margin:0; font-size:21px; font-weight:400; letter-spacing:.34em;
  text-transform:uppercase;
}
.brand .ver{font-size:12px; letter-spacing:.22em; color:var(--ph-dim)}
.leds{display:flex; gap:14px; margin-left:auto; align-items:center; flex-wrap:wrap}
.led{display:flex; align-items:center; gap:7px; font-size:12px; letter-spacing:.18em;
  color:var(--ph-dim); text-transform:uppercase}
.led b{
  width:8px; height:8px; background:var(--led); display:block;
  box-shadow:0 0 8px var(--led); animation:pulse 2.4s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.led.off b{background:var(--ph-ghost); box-shadow:none; animation:none}

/* --- палитра тем --- */
.palette{position:relative}
.palette>button{display:flex; align-items:center; gap:8px}
.chip{width:11px; height:11px; display:block; border:1px solid rgba(0,0,0,.35)}
.menu{
  position:absolute; top:calc(100% + 8px); right:0; z-index:120; min-width:252px;
  background:var(--bg-2); border:1px solid var(--ph); padding:4px;
  box-shadow:0 0 26px -8px var(--ph); display:none;
  max-height:min(66vh, 430px); overflow:auto;
}
.menu.open{display:block}
.menu button{
  display:flex; align-items:center; gap:9px; width:100%; border:0; text-align:left;
  padding:10px 11px; letter-spacing:.14em;
}
.menu button:hover{background:var(--ph-ghost); box-shadow:none}
.menu button[aria-current="true"]{background:var(--ph); color:var(--bg); text-shadow:none}
.menu .sub{margin-left:auto; font-size:11px; letter-spacing:.1em; opacity:.65; text-transform:none}

/* --- toolbar --- */
.toolbar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:11px 20px; border-bottom:1px solid var(--ph-dim);
  background:rgba(0,0,0,.25);
}
button, .seg span, select{
  font-family:inherit; font-size:13px; letter-spacing:.16em; text-transform:uppercase;
  background:transparent; color:var(--ph); border:1px solid var(--ph-dim);
  padding:9px 15px; cursor:pointer; position:relative;
  transition:background .12s linear, color .12s linear, box-shadow .12s linear;
}
button:hover, .seg span:hover{background:var(--ph-ghost); box-shadow:0 0 12px -2px var(--ph)}
button:active{transform:translateY(1px)}
button.primary{border-color:var(--ph); box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), 0 0 14px -6px var(--ph)}
button.primary:hover{background:var(--ph); color:var(--bg); text-shadow:none}
button:disabled{opacity:.35; cursor:not-allowed}

.seg{display:flex; border:1px solid var(--ph-dim)}
.seg span{border:0; border-right:1px solid var(--ph-dim); user-select:none}
.seg span:last-child{border-right:0}
.seg span[aria-selected="true"]{background:var(--ph); color:var(--bg); text-shadow:none}
.sep{width:1px; height:26px; background:var(--ph-dim); opacity:.6}
.label{font-size:12px; letter-spacing:.2em; color:var(--ph-dim); text-transform:uppercase}

/* тумблер: пустая рамка / крестик */
.tgl{
  display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none;
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--ph-dim); padding:8px 13px; border:1px solid var(--ph-dim);
  transition:color .15s, border-color .15s, box-shadow .15s;
}
.tgl:hover{color:var(--ph); border-color:var(--ph)}
.tgl input{position:absolute; opacity:0; width:0; height:0}
.tgl .box{
  width:16px; height:16px; border:1px solid var(--ph-dim); display:block;
  position:relative; flex:none;
}
.tgl .box::after{
  content:"×"; position:absolute; inset:0; display:flex;
  align-items:center; justify-content:center;
  font-size:17px; line-height:1; color:var(--ph); opacity:0;
  transform:scale(.4); transition:opacity .12s, transform .12s;
}
.tgl input:checked ~ .box{border-color:var(--ph); box-shadow:0 0 10px -3px var(--ph)}
.tgl input:checked ~ .box::after{opacity:1; transform:scale(1)}
.tgl:has(input:checked){color:var(--ph); border-color:var(--ph)}
.tgl input:focus-visible ~ .box{outline:1px solid var(--ph); outline-offset:2px}
select{padding:8px 10px}
select option{background:var(--bg-2); color:var(--ph)}
.spacer{margin-left:auto}

/* --- panels --- */
main{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:0}
.pane{display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;
  border-right:1px solid var(--ph-dim); background:var(--panel)}
.pane:last-child{border-right:0}
.pane-head{
  display:flex; align-items:center; gap:11px; padding:9px 14px;
  border-bottom:1px solid var(--ph-dim); font-size:12px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ph-dim); background:rgba(0,0,0,.35);
}
.pane-head .dot{width:6px;height:6px;background:var(--ph);box-shadow:0 0 6px var(--ph)}
.pane-head .meta{margin-left:auto; font-size:12px; letter-spacing:.14em}
.editor{flex:1; display:flex; min-height:0; position:relative}
.gutter{
  padding:10px 9px 10px 13px; text-align:right; color:var(--ph-dim);
  font-size:var(--code); line-height:1.45; user-select:none; overflow:hidden;
  border-right:1px solid var(--ph-ghost); background:rgba(0,0,0,.25);
  min-width:52px; white-space:pre; text-shadow:none;
}
textarea{
  position:relative; z-index:1;
  flex:1; width:100%; resize:none; border:0; outline:0; padding:10px 14px;
  background:transparent; color:var(--ph); font-family:inherit;
  font-size:var(--code); line-height:1.45; white-space:pre; overflow:auto;
  caret-color:var(--ph); tab-size:2;
}
textarea::placeholder{color:var(--ph-dim); opacity:.7}
textarea::selection{background:var(--ph); color:var(--bg); text-shadow:none}
textarea::-webkit-scrollbar{width:10px;height:10px}
textarea::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
textarea::-webkit-scrollbar-thumb{background:var(--ph-ghost); border:1px solid var(--ph-dim)}
textarea::-webkit-scrollbar-thumb:hover{background:var(--ph-dim)}

.corner{position:absolute; width:9px; height:9px; border:1px solid var(--ph-dim); pointer-events:none}
.c-tl{top:4px;left:4px;border-right:0;border-bottom:0}
.c-tr{top:4px;right:4px;border-left:0;border-bottom:0}
.c-bl{bottom:4px;left:4px;border-right:0;border-top:0}
.c-br{bottom:4px;right:4px;border-left:0;border-top:0}

/* --- diagnostics --- */
#diag{
  max-height:180px; overflow:auto; border-top:1px solid var(--ph-dim);
  padding:10px 15px; font-size:13px; background:rgba(0,0,0,.4); display:none;
}
#diag.show{display:block}
#diag .row{display:flex; gap:8px; padding:2px 0}
#diag .row .tag{min-width:66px; font-size:11px; letter-spacing:.16em; opacity:.9}
.lvl-err{color:var(--err)} .lvl-warn{color:var(--warn)} .lvl-info{color:var(--ph-dim)}
.lvl-fix{color:var(--ph)}

/* --- status bar --- */
footer{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:9px 20px; border-top:1px solid var(--ph-dim);
  font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ph-dim);
  background:linear-gradient(0deg, var(--bg-2), transparent);
}
/* значения фиксированной ширины — статусная строка не должна дёргаться */
footer b{color:var(--ph); font-weight:400; display:inline-block; text-align:left}
#stStatus{min-width:18ch}
#stMode{min-width:13ch}
#stSave{min-width:13ch}
#stDiag{min-width:3ch}
#stToday,#stTotal,#stSession{min-width:4ch}
.cursor{display:inline-block; width:8px; height:14px; background:var(--ph);
  vertical-align:-2px; animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* --- drop zone --- */
#drop{
  position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.82); border:2px dashed var(--ph);
  font-size:18px; letter-spacing:.3em; text-transform:uppercase;
}
#drop.show{display:flex}

/* --- toast --- */
#toast{
  position:fixed; bottom:44px; left:50%; transform:translateX(-50%) translateY(14px);
  z-index:120; padding:11px 20px; border:1px solid var(--ph); background:var(--bg-2);
  font-size:13px; letter-spacing:.2em; text-transform:uppercase; opacity:0;
  transition:opacity .18s, transform .18s; pointer-events:none;
  box-shadow:0 0 22px -6px var(--ph);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  main{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
  .pane{border-right:0; border-bottom:1px solid var(--ph-dim)}
  .brand h1{font-size:17px; letter-spacing:.2em}
  body{overflow:auto}
}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="crt"></div>
<div id="portal" aria-hidden="true"></div>
<div id="drop">▚ отпустите файл — загрузим в буфер ▚</div>
<div id="toast"></div>

<div id="app">

  <header>
    <div class="brand">
      <h1 id="brandName">Alien Markup</h1>
      <span class="ver">unit 2.1 / semiotic markup processor</span>
    </div>
    <div class="leds">
      <span class="led"><b></b>core</span>
      <span class="led" id="ledParse"><b></b>parser</span>
      <span class="led off" id="ledErr"><b></b>errors</span>
      <div class="palette">
        <button id="themeBtn" aria-haspopup="true" aria-expanded="false" title="Оформление (Ctrl+Shift+T)">
          <span class="chip" id="themeChip"></span><span id="themeLabel">alien</span> ▾
        </button>
        <div class="menu" id="themeMenu" role="menu"></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="primary" id="btnFormat">▶ форматировать</button>
    <button id="btnMinify">▼ сжать</button>
    <div class="seg" id="levelSeg" role="tablist" title="Степень сжатия">
      <span role="tab" data-lv="1">L1 safe</span>
      <span role="tab" data-lv="2" aria-selected="true">L2 balanced</span>
      <span role="tab" data-lv="3">L3 extreme</span>
    </div>
    <div class="sep"></div>
    <span class="label">отступ</span>
    <select id="indentSel">
      <option value="2">2 пробела</option>
      <option value="4">4 пробела</option>
      <option value="tab">таб</option>
    </select>
    <label class="tgl" id="typoLabel" title="Русская типографика: кавычки-ёлочки, тире, неразрывные пробелы после предлогов">
      <input type="checkbox" id="typoOn"><span class="box"></span>типографика
    </label>
    <div class="sep"></div>
    <button id="btnSample">образец</button>
    <button id="btnSwap">↺ в ввод</button>
    <button id="btnClear">очистить</button>
    <div class="spacer"></div>
    <button id="btnCopy">копировать</button>
    <button id="btnDownload">скачать</button>
  </div>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span class="dot"></span><span>input // исходная верстка</span>
        <span class="meta" id="inMeta">0 симв · 0 стр</span>
      </div>
      <div class="editor">
        <div class="gutter" id="gutIn">1</div>
        <textarea id="input" spellcheck="false" autocomplete="off"
          placeholder="Вставьте HTML сюда, либо перетащите файл в окно…"></textarea>
      </div>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span class="dot"></span><span>output // результат</span>
        <span class="meta" id="outMeta">—</span>
      </div>
      <div class="editor">
        <div class="gutter" id="gutOut">1</div>
        <textarea id="output" spellcheck="false" autocomplete="off" readonly></textarea>
      </div>
      <div id="diag"></div>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
    </section>
  </main>

  <footer>
    <span>статус: <b id="stStatus">ожидание</b><span class="cursor"></span></span>
    <span>режим: <b id="stMode">—</b></span>
    <span>экономия: <b id="stSave">—</b></span>
    <span>диагностика: <b id="stDiag">0</b></span>
    <span class="spacer"></span>
    <span>за сегодня: <b id="stToday">0</b></span>
    <span>всего: <b id="stTotal">0</b></span>
    <span>сессия: <b id="stSession">0</b></span>
  </footer>
</div>

<!-- ENGINE:START (собрано из engine.js командой: node build.js) -->
<script>
/* =============================================================
 *  ALIEN MARKUP — engine.js
 *  HTML beautifier / minifier with template-language awareness.
 *  Zero dependencies. Works in the browser and in Node.
 * ============================================================= */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;
  root.AMEngine = api;
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  /* ---------------------------------------------------------- *
   * 1. Tag dictionaries
   * ---------------------------------------------------------- */

  var VOID = new Set(('area base br col embed hr img input link meta param source ' +
    'track wbr command keygen basefont frame isindex').split(' '));

  var RAW_TEXT = new Set(['script', 'style']);      // content preserved, re-indented
  var PRE_TEXT = new Set(['pre', 'textarea']);      // content preserved byte-for-byte

  var INLINE = new Set(('a abbr acronym b bdi bdo big br button cite code data datalist ' +
    'del dfn em font i img input ins kbd label map mark meter noscript object output ' +
    'picture progress q ruby s samp select small span strike strong sub sup svg template ' +
    'textarea time tt u var video audio wbr').split(' '));

  var HTML_TAGS = new Set(('a abbr address area article aside audio b base bdi bdo big ' +
    'blockquote body br button canvas caption cite code col colgroup data datalist dd del ' +
    'details dfn dialog div dl dt em embed fieldset figcaption figure footer form h1 h2 h3 ' +
    'h4 h5 h6 head header hgroup hr html i iframe img input ins kbd label legend li link ' +
    'main map mark menu meta meter nav noscript object ol optgroup option output p param ' +
    'picture pre progress q rp rt ruby s samp script search section select slot small source ' +
    'span strong style sub summary sup table tbody td template textarea tfoot th thead time ' +
    'title tr track u ul var video wbr').split(' '));

  var BOOLEAN_ATTRS = new Set(('allowfullscreen async autofocus autoplay checked controls ' +
    'default defer disabled formnovalidate hidden inert ismap itemscope loop multiple muted ' +
    'nomodule novalidate open playsinline readonly required reversed selected').split(' '));

  /* ---------------------------------------------------------- *
   * 2. Template language detection
   * ---------------------------------------------------------- */

  // Blade / generic at-directives that open a nesting level
  var AT_OPEN = new Set(('if unless foreach for forelse while switch section push prepend ' +
    'once auth guest can cannot canany isset empty verbatim error env production hasSection ' +
    'sectionMissing php slot component fragment prependOnce pushOnce').split(' '));
  var AT_MID = new Set(('else elseif elseIf empty case default emptyElse').split(' '));

  // {% ... %} openers (Jinja / Twig / Django / Liquid / Nunjucks)
  var CURLY_OPEN = new Set(('if for foreach while block with unless each switch macro filter ' +
    'raw verbatim section forelse auth guest push prepend once can spaceless apply embed ' +
    'comment autoescape blocktrans blocktranslate ifchanged capture form tablerow schema ' +
    'javascript stylesheet paginate').split(' '));
  var CURLY_MID = new Set(('else elseif elif empty otherwise when case default ifchanged ' +
    'plural').split(' '));

  var ERB_OPEN = /^\s*(if|unless|for|while|until|case|begin|module|class|def)\b|(\bdo\b\s*(\|[^|]*\|)?\s*)$|\{\s*(\|[^|]*\|)?\s*$/;
  var ERB_CLOSE = /^\s*(end|\})\b|^\s*end\s*$/;
  var ERB_MID = /^\s*(else|elsif|elseif|when|rescue|ensure)\b/;

  /* ---------------------------------------------------------- *
   * 3. Tokenizer
   * ---------------------------------------------------------- */

  function isWS(c) { return c === ' ' || c === '\t' || c === '\n' || c === '\r' || c === '\f'; }

  // Scan a balanced {...} starting at i (src[i] === '{'), quote-aware.
  function scanBraces(src, i) {
    var depth = 0, q = null;
    for (var j = i; j < src.length; j++) {
      var c = src[j];
      if (q) {
        if (c === '\\') { j++; continue; }
        if (c === q) q = null;
        continue;
      }
      if (c === '"' || c === "'" || c === '`') { q = c; continue; }
      if (c === '{') depth++;
      else if (c === '}') { depth--; if (depth === 0) return j + 1; }
    }
    return src.length;
  }

  function scanParens(src, i) {
    var depth = 0, q = null;
    for (var j = i; j < src.length; j++) {
      var c = src[j];
      if (q) {
        if (c === '\\') { j++; continue; }
        if (c === q) q = null;
        continue;
      }
      if (c === '"' || c === "'" || c === '`') { q = c; continue; }
      if (c === '(') depth++;
      else if (c === ')') { depth--; if (depth === 0) return j + 1; }
    }
    return src.length;
  }

  var AT_KNOWN = new Set(Array.from(AT_OPEN).concat(Array.from(AT_MID)).concat(
    ('endif endunless endforeach endfor endforelse endwhile endswitch endsection endpush ' +
      'endprepend endonce endauth endguest endcan endcannot endcanany endisset endempty ' +
      'endverbatim enderror endenv endproduction endphp endslot endcomponent endfragment ' +
      'endhasSection endsectionMissing endcapture stop show yield extends include includeIf ' +
      'includeWhen csrf method json dd dump break continue parent props class style checked ' +
      'selected disabled required lang livewire vite viteReactRefresh').split(' ')));

  /**
   * Detects a template token starting at position i.
   * Returns { v, end, k } or null.
   */
  function matchTplAt(src, i) {
    var c = src[i], c2 = src[i + 1], e;

    if (c === '<' && c2 === '?') {
      e = src.indexOf('?>', i + 2);
      e = e === -1 ? src.length : e + 2;
      return { v: src.slice(i, e), end: e, k: 'php' };
    }
    if (c === '<' && c2 === '%') {
      e = src.indexOf('%>', i + 2);
      e = e === -1 ? src.length : e + 2;
      return { v: src.slice(i, e), end: e, k: 'erb' };
    }
    if (c === '{' && c2 === '{') {
      var triple = src[i + 2] === '{';
      var closer = triple ? '}}}' : '}}';
      e = src.indexOf(closer, i + 2);
      e = e === -1 ? src.length : e + closer.length;
      return { v: src.slice(i, e), end: e, k: 'mustache' };
    }
    if (c === '{' && c2 === '%') {
      e = src.indexOf('%}', i + 2);
      e = e === -1 ? src.length : e + 2;
      return { v: src.slice(i, e), end: e, k: 'curly' };
    }
    if (c === '{' && c2 === '#') {
      e = src.indexOf('#}', i + 2);
      e = e === -1 ? src.length : e + 2;
      return { v: src.slice(i, e), end: e, k: 'curlycomment' };
    }
    if (c === '$' && c2 === '{') {
      e = scanBraces(src, i + 1);
      return { v: src.slice(i, e), end: e, k: 'interp' };
    }
    if (c === '@' && c2 === '{') {
      e = scanBraces(src, i + 1);
      return { v: src.slice(i, e), end: e, k: 'atbrace' };
    }
    if (c === '@' && c2 === '@') {          // @@escaped blade
      return { v: src.slice(i, i + 2), end: i + 2, k: 'text' };
    }
    if (c === '@' && /[a-zA-Z]/.test(c2 || '')) {
      var prev = i > 0 ? src[i - 1] : '\n';
      // avoid matching e-mails / handles inside words
      if (/[\w.\-@]/.test(prev)) return null;
      var m = /^@([a-zA-Z_][\w]*)/.exec(src.slice(i));
      if (!m) return null;
      var name = m[1];
      var j = i + m[0].length;
      var hasArgs = src[j] === '(';
      if (!hasArgs && !AT_KNOWN.has(name)) return null;
      if (hasArgs) j = scanParens(src, j);
      return { v: src.slice(i, j), end: j, k: 'at', name: name };
    }
    return null;
  }

  /**
   * Вставка действительно закрыта своим маркером, а не упёрлась в конец файла.
   * Нужно, чтобы незакрытая «${» не проглотила остаток документа.
   */
  function tplComplete(t) {
    switch (t.k) {
      case 'php':          return /\?>$/.test(t.v);
      case 'erb':          return /%>$/.test(t.v);
      case 'mustache':     return /\}\}+$/.test(t.v);
      case 'curly':        return /%\}$/.test(t.v);
      case 'curlycomment': return /#\}$/.test(t.v);
      case 'interp':
      case 'atbrace':      return /\}$/.test(t.v);
      default:             return true;
    }
  }

  function parseTag(src, i) {
    var m = /^<([a-zA-Z][\w:.\-]*)/.exec(src.slice(i));
    if (!m) return null;
    var rawName = m[1];
    var j = i + m[0].length;
    var attrs = [];
    var self = false;
    var n = src.length;

    var unterminated = false;

    while (j < n) {
      while (j < n && isWS(src[j])) j++;
      if (j >= n) { unterminated = true; break; }
      if (src[j] === '>') { j++; break; }
      if (src[j] === '/' && src[j + 1] === '>') { self = true; j += 2; break; }
      // забыли «>»: дальше начинается следующий тег — обрываем этот,
      // иначе разбор проглотил бы весь остаток документа
      if (src[j] === '<' && /[a-zA-Z\/!]/.test(src[j + 1] || '')) { unterminated = true; break; }

      var tpl = matchTplAt(src, j);
      if (tpl) { attrs.push({ raw: tpl.v, tpl: true }); j = tpl.end; continue; }

      var ns = j;
      while (j < n && !isWS(src[j]) && src[j] !== '=' && src[j] !== '>' &&
             !(src[j] === '/' && src[j + 1] === '>')) {
        var t2 = matchTplAt(src, j);
        if (t2) { j = t2.end; continue; }
        j++;
      }
      var aname = src.slice(ns, j);
      if (!aname) { j++; continue; }

      var value = null, quote = '';
      var k = j;
      while (k < n && isWS(src[k])) k++;
      if (src[k] === '=') {
        k++;
        while (k < n && isWS(src[k])) k++;
        if (src[k] === '"' || src[k] === "'") {
          quote = src[k];
          var vstart = ++k;
          // Внутри значения может стоять шаблонная вставка со своими кавычками:
          // href="${Search("item").Url}" — такую вставку перешагиваем целиком,
          // иначе значение оборвётся на первой же внутренней кавычке.
          while (k < n && src[k] !== quote) {
            var tv = matchTplAt(src, k);
            if (tv && tv.end > k && tplComplete(tv)) { k = tv.end; continue; }
            k++;
          }
          value = src.slice(vstart, k);
          k = k < n ? k + 1 : n;
        } else {
          var vs = k;
          while (k < n && !isWS(src[k]) && src[k] !== '>') {
            var t3 = matchTplAt(src, k);
            if (t3) { k = t3.end; continue; }
            k++;
          }
          value = src.slice(vs, k);
          if (value.length > 1 && value.slice(-1) === '/' && src[k] === '>') {
            value = value.slice(0, -1);
            self = true;
          }
        }
        j = k;
      }
      attrs.push({ name: aname, value: value, quote: quote || '"' });
    }

    var lower = rawName.toLowerCase();
    return {
      token: {
        t: 'open',
        name: lower,
        rawName: rawName,
        attrs: attrs,
        self: self || VOID.has(lower),
        slash: self,                 // в исходнике действительно был « />»
        void: VOID.has(lower),
        unterminated: unterminated
      },
      end: j
    };
  }

  function tokenize(src) {
    var toks = [], i = 0, n = src.length, buf = '', bufStart = 0;

    function flush() {
      if (!buf) return;
      toks.push({ t: 'text', v: buf, s: bufStart, e: bufStart + buf.length });
      buf = '';
    }
    function eat(k) { if (!buf) bufStart = i; buf += k; }

    while (i < n) {
      var c = src[i];

      if (c === '<') {
        if (src.startsWith('<!--', i)) {
          var e = src.indexOf('-->', i + 4);
          e = e === -1 ? n : e + 3;
          var cv = src.slice(i, e);
          // Условный комментарий Outlook оборачивает настоящую разметку.
          // Раскрываем его в общий поток токенов: теги внутри должны попасть
          // в общий стек, иначе содержимое после <![endif]--> теряет вложенность.
          var cm = /^(<!--\[[^\]]*\]>)([\s\S]*)(<!\[endif\]\s*-->)$/i.exec(cv);
          if (cm && /<[a-zA-Z\/]/.test(cm[2])) {
            flush();
            toks.push({ t: 'condopen', v: cm[1], s: i, e: i + cm[1].length });
            var inner = tokenize(cm[2]);
            var shift = i + cm[1].length;
            for (var ii = 0; ii < inner.length; ii++) {
              inner[ii].s += shift; inner[ii].e += shift;
              toks.push(inner[ii]);
            }
            toks.push({ t: 'condclose', v: cm[3], s: e - cm[3].length, e: e });
            i = e; continue;
          }
          flush(); toks.push({ t: 'comment', v: cv, s: i, e: e }); i = e; continue;
        }
        if (src.startsWith('<![', i)) {                     // CDATA / downlevel-revealed
          var ce = src.indexOf(']>', i);
          ce = ce === -1 ? n : ce + 2;
          flush(); toks.push({ t: 'comment', v: src.slice(i, ce), keep: true, s: i, e: ce }); i = ce; continue;
        }
        if (src.startsWith('<!', i)) {
          var de = src.indexOf('>', i);
          de = de === -1 ? n : de + 1;
          flush(); toks.push({ t: 'doctype', v: src.slice(i, de), s: i, e: de }); i = de; continue;
        }
        if (src[i + 1] === '?' || src[i + 1] === '%') {
          var tp = matchTplAt(src, i);
          flush(); toks.push({ t: 'tpl', v: tp.v, k: tp.k, s: i, e: tp.end }); i = tp.end; continue;
        }
        if (src.startsWith('</', i)) {
          var cm = /^<\/\s*([a-zA-Z][\w:.\-]*)\s*>/.exec(src.slice(i));
          if (cm) {
            flush();
            toks.push({ t: 'close', name: cm[1].toLowerCase(), rawName: cm[1],
                        s: i, e: i + cm[0].length });
            i += cm[0].length; continue;
          }
        }
        if (/[a-zA-Z]/.test(src[i + 1] || '')) {
          var parsed = parseTag(src, i);
          if (parsed) {
            flush();
            parsed.token.s = i;
            parsed.token.e = parsed.end;
            toks.push(parsed.token);
            i = parsed.end;
            var nm = parsed.token.name;
            if (!parsed.token.self && (RAW_TEXT.has(nm) || PRE_TEXT.has(nm))) {
              var re = new RegExp('</\\s*' + nm + '\\s*>', 'i');
              var mm = re.exec(src.slice(i));
              var stop = mm ? i + mm.index : n;
              toks.push({ t: 'raw', v: src.slice(i, stop), name: nm, s: i, e: stop });
              i = stop;
            }
            continue;
          }
        }
        eat(c); i++; continue;
      }

      var t = matchTplAt(src, i);
      if (t) {
        if (t.k === 'text') { eat(t.v); i = t.end; continue; }
        flush();
        toks.push({ t: 'tpl', v: t.v, k: t.k, name: t.name, s: i, e: t.end });
        i = t.end; continue;
      }

      eat(c); i++;
    }
    flush();
    return toks;
  }

  /* ---------------------------------------------------------- *
   * 4. Template block classification
   * ---------------------------------------------------------- */

  function netBraces(s) {
    var d = 0, q = null;
    for (var i = 0; i < s.length; i++) {
      var c = s[i];
      if (q) { if (c === '\\') { i++; continue; } if (c === q) q = null; continue; }
      if (c === '"' || c === "'" || c === '`') { q = c; continue; }
      if (c === '{') d++;
      else if (c === '}') d--;
    }
    return d;
  }

  function classifyTpl(tok) {
    var v = tok.v, k = tok.k, inner;

    if (k === 'php') {
      inner = v.replace(/^<\?(php|=)?/, '').replace(/\?>$/, '');
      var body = inner.trim();
      if (/^\}\s*(else|elseif|catch|finally)\b/.test(body)) return 'mid';
      if (/^(else|elseif|elif)\b/.test(body) && /:\s*$/.test(body)) return 'mid';
      if (/^(else|elseif)\s*:?\s*$/.test(body)) return 'mid';
      if (/\b(endif|endforeach|endfor|endwhile|endswitch)\s*;?\s*$/.test(body)) return 'close';
      if (/\b(if|foreach|for|while|switch)\s*\(.*\)\s*:\s*$/.test(body)) return 'open';
      var nb = netBraces(body);
      if (nb > 0) return 'open';
      if (nb < 0) return 'close';
      return 'leaf';
    }

    if (k === 'erb') {
      inner = v.replace(/^<%[-=#]?/, '').replace(/[-]?%>$/, '');
      if (/^\s*#/.test(inner)) return 'leaf';
      if (ERB_MID.test(inner)) return 'mid';
      if (ERB_CLOSE.test(inner)) return 'close';
      if (ERB_OPEN.test(inner)) return 'open';
      return 'leaf';
    }

    if (k === 'curly') {
      inner = v.replace(/^\{%[-~]?/, '').replace(/[-~]?%\}$/, '').trim();
      var w = (/^([a-zA-Z_][\w]*)/.exec(inner) || [, ''])[1];
      if (/^end/.test(w) || w === 'endblock') return 'close';
      if (CURLY_MID.has(w)) return 'mid';
      if (CURLY_OPEN.has(w)) {
        // Twig inline forms like {% set x = 1 %} are not blocks
        if (w === 'block' && /%\}$/.test(v) && /\bblock\s+\w+\s+\S/.test(inner)) return 'leaf';
        return 'open';
      }
      return 'leaf';
    }

    if (k === 'mustache') {
      inner = v.replace(/^\{\{+[~]?/, '').replace(/[~]?\}\}+$/, '').trim();
      if (/^#/.test(inner)) return 'open';
      if (/^\//.test(inner)) return 'close';
      if (/^(else|\^)/.test(inner)) return 'mid';
      return 'leaf';
    }

    // @{ ... } blocks (Mindbox / Postal и подобные)
    if (k === 'atbrace') {
      inner = v.replace(/^@\{/, '').replace(/\}$/, '').replace(/\s+/g, ' ').trim();
      if (/^(end|\/)\s*(if|for|foreach|while|switch|unless|with|block|repeat)?\b/i.test(inner)) return 'close';
      if (/^(else|elseif|elsif|else\s+if)\b/i.test(inner)) return 'mid';
      if (/^(if|for|foreach|while|switch|unless|with|block|repeat)\b/i.test(inner)) return 'open';
      return 'leaf';
    }

    if (k === 'at') {
      var nm = tok.name || '';
      if (/^end/.test(nm) || nm === 'stop' || nm === 'show') return 'close';
      if (AT_MID.has(nm)) return 'mid';
      if (AT_OPEN.has(nm)) return 'open';
      return 'leaf';
    }

    return 'leaf';
  }

  /* ---------------------------------------------------------- *
   * 5. Tree
   * ---------------------------------------------------------- */

  function buildTree(toks) {
    var root = { type: 'root', children: [] };
    var stack = [root];
    var warnings = [];

    function cur() { return stack[stack.length - 1]; }
    function add(node) { cur().children.push(node); }

    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];

      if (tk.t === 'open') {
        var node = { type: 'el', name: tk.name, tok: tk, children: [], closed: tk.self };
        add(node);
        if (!tk.self) stack.push(node);
        continue;
      }

      if (tk.t === 'close') {
        var idx = -1;
        for (var s = stack.length - 1; s > 0; s--) {
          if (stack[s].type === 'el' && stack[s].name === tk.name) { idx = s; break; }
        }
        if (idx === -1) {
          warnings.push({ level: 'err', fix: 'stray', pos: tk.s,
            msg: 'Закрывающий тег без пары: </' + tk.name + '>' });
          add({ type: 'stray', tok: tk });
        } else {
          for (var p = stack.length - 1; p > idx; p--) {
            if (stack[p].type === 'el') {
              warnings.push({ level: 'warn', fix: 'unclosed', pos: stack[p].tok.s,
                msg: 'Незакрытый тег <' + stack[p].name + '> внутри <' + tk.name + '>' });
            } else {
              warnings.push({ level: 'warn', pos: stack[p].tok.s,
                msg: 'Незакрытый блок ' + short(stack[p].tok.v) });
            }
          }
          stack[idx].closed = true;
          stack.length = idx;
        }
        continue;
      }

      if (tk.t === 'condopen' || tk.t === 'condclose') {
        add({ type: 'cond', tok: tk }); continue;
      }
      if (tk.t === 'raw') { add({ type: 'raw', tok: tk }); continue; }
      if (tk.t === 'text') { add({ type: 'text', tok: tk }); continue; }
      if (tk.t === 'comment') { add({ type: 'comment', tok: tk }); continue; }
      if (tk.t === 'doctype') { add({ type: 'doctype', tok: tk }); continue; }

      if (tk.t === 'tpl') {
        var cls = classifyTpl(tk);
        if (cls === 'open') {
          var tn = { type: 'tpl', tok: tk, children: [] };
          add(tn); stack.push(tn);
        } else if (cls === 'close') {
          var ti = -1;
          for (var q = stack.length - 1; q > 0; q--) {
            if (stack[q].type === 'tpl') { ti = q; break; }
          }
          if (ti === -1) {
            add({ type: 'tplleaf', tok: tk });
          } else {
            for (var r = stack.length - 1; r > ti; r--) {
              if (stack[r].type === 'el') {
                warnings.push({ level: 'warn', fix: 'unclosed', pos: stack[r].tok.s,
                msg: 'Тег <' + stack[r].name + '> не закрыт внутри шаблонного блока' });
              }
            }
            stack[ti].closeTok = tk;
            stack.length = ti;
          }
        } else if (cls === 'mid') {
          var mi = -1;
          for (var z = stack.length - 1; z > 0; z--) {
            if (stack[z].type === 'tpl') { mi = z; break; }
          }
          if (mi === stack.length - 1) add({ type: 'tplmid', tok: tk });
          else add({ type: 'tplleaf', tok: tk });
        } else {
          add({ type: 'tplleaf', tok: tk });
        }
        continue;
      }
    }

    for (var f = stack.length - 1; f > 0; f--) {
      if (stack[f].type === 'el') {
        warnings.push({ level: 'err', fix: 'unclosed', pos: stack[f].tok.s,
          msg: 'Тег <' + stack[f].name + '> так и не закрыт' });
      } else {
        warnings.push({ level: 'err', pos: stack[f].tok.s,
          msg: 'Шаблонный блок ' + short(stack[f].tok.v) + ' не закрыт' });
      }
    }

    return { root: root, warnings: warnings };
  }

  function short(s) {
    s = String(s).replace(/\s+/g, ' ').trim();
    return s.length > 28 ? s.slice(0, 28) + '…' : s;
  }

  /* ---------------------------------------------------------- *
   * 6. Serialisation helpers
   * ---------------------------------------------------------- */

  function tagName(tok, opts) {
    if (opts && opts.lowercase && HTML_TAGS.has(tok.name)) return tok.name;
    return HTML_TAGS.has(tok.name) ? tok.name : tok.rawName;
  }

  function attrToString(a, opts) {
    if (a.tpl) return a.raw;
    if (a.value === null) return a.name;
    var q = a.quote || '"';
    var v = a.value;
    // многострочные class/style/srcset схлопываем — иначе разметка «уезжает» влево
    if (v.indexOf('\n') !== -1 && /^(class|style|srcset|sizes)$/i.test(a.name)) {
      v = v.replace(/\s+/g, ' ').trim();
    }
    if (opts && opts.unquote && v !== '' && /^[^\s"'`=<>]+$/.test(v) && !/\/$/.test(v)) return a.name + '=' + v;
    // кавычки оставляем те, что выбрал автор: подмена ломает шаблонные вставки
    // вида href="${Search("item").Url}", где внутренние кавычки — часть выражения
    return a.name + '=' + q + v + q;

  function openTag(tok, opts) {
    opts = opts || {};
    var name = tagName(tok, opts);

    var attrs = tok.attrs;

    if (opts.dropAttrs) attrs = optimiseAttrs(tok, attrs);

    for (var i = 0; i < attrs.length; i++) {

      if (s) parts.push(s);

    var body = parts.length ? name + ' ' + parts.join(' ') : name;
    // foreign content (SVG/MathML) and custom elements must keep the slash;
    // у void-тегов слеш сохраняем ровно так, как его написал автор
    if (tok.self && !tok.void) return '<' + body + ' />';
    if (tok.void) return '<' + body + (tok.slash && !(opts && opts.dropSlash) ? ' />' : '>');
    return '<' + body + '>';
  }

  function optimiseAttrs(tok, attrs) {
    var out = [];
    for (var i = 0; i < attrs.length; i++) {
      var a = attrs[i];
      if (a.tpl) { out.push(a); continue; }
      var ln = (a.name || '').toLowerCase();
      var val = a.value === null ? null : a.value.trim();

      // empty, meaningless attributes
      if (val === '' && (ln === 'class' || ln === 'style' || ln === 'id' || ln === 'title')) continue;
      // redundant type declarations
      if (tok.name === 'script' && ln === 'type' && /^(text\/javascript|application\/javascript)$/i.test(val || '')) continue;
      if (tok.name === 'style' && ln === 'type' && /^text\/css$/i.test(val || '')) continue;
      if (tok.name === 'link' && ln === 'type' && /^text\/css$/i.test(val || '')) continue;
      if (ln === 'language' && tok.name === 'script') continue;
      if (tok.name === 'form' && ln === 'method' && /^get$/i.test(val || '')) continue;
      // boolean attributes
      if (BOOLEAN_ATTRS.has(ln) && (val === '' || (val || '').toLowerCase() === ln || (val || '').toLowerCase() === 'true')) {
        out.push({ name: a.name, value: null, quote: '"' });
        continue;
      }
      if (val !== null && (ln === 'class' || ln === 'style')) {
        val = val.replace(/\s+/g, ' ').trim();
        if (ln === 'style') val = val.replace(/\s*;\s*$/, '').replace(/\s*:\s*/g, ':').replace(/\s*;\s*/g, ';');
      }
      out.push({ name: a.name, value: val, quote: a.quote });
    }
    return dedupe(out);
  }

  function dedupe(attrs) {
    var seen = Object.create(null), out = [];
    for (var i = 0; i < attrs.length; i++) {
      var a = attrs[i];
      if (a.tpl) { out.push(a); continue; }
      var key = (a.name || '').toLowerCase();
      if (seen[key]) continue;
      seen[key] = 1;
      out.push(a);
    }
    return out;
  }

  // Закрывающий тег выводится только если он реально был в исходнике:
  // форматтер не дописывает теги за автором.
  function closeTag(node, opts) {
    if (node.closed === false) return '';
    return '</' + tagName(node.tok, opts) + '>';
  }

  /* ---------------------------------------------------------- *
   * 7. Beautifier
   * ---------------------------------------------------------- */

  var SENTINEL = '';   // private-use char: never appears in real markup

  // Вставки в фигурных скобках считаем атомарной строкой: всегда одна строка,
  // содержимое не разбирается и не переносится.
  var BRACE_TPL = { atbrace: 1, interp: 1, mustache: 1, curly: 1 };

  var DEFAULTS = {
    indent: '  ',
    inlineMax: 100,
    keepBlankLines: false,
    lowercase: false
  };

  /**
   * Директива шаблонизатора — управляющая конструкция, которой место
   * на отдельной строке: @{set …}, @{if …}, <?php … ?>, {% for … %}.
   * Подстановки значений (${x}, {{ y }}) считаются частью текста
   * и остаются внутри строки.
   */
  function isDirective(node) {
    if (node.type === 'tpl' || node.type === 'tplmid') return true;
    if (node.type !== 'tplleaf') return false;
    var k = node.tok.k;
    return k !== 'interp' && k !== 'mustache';
  }

  /**
   * Прогон строчных узлов, разложенный на строки по директивам.
   * Разрыв ставится только там, где в исходнике уже был пробел:
   * перенос строки в HTML равен пробелу, поэтому «текст@{if …}»
   * и «@{end if}@{end for}» разрывать нельзя — отрисовка изменится.
   */
  function runToLines(run, opts) {
    var out = [];
    var cur = '';

    function flush() {
      var t = cur.trim();
      if (t) out.push(t);
      cur = '';
    }

    for (var i = 0; i < run.length; i++) {
      var c = run[i];
      var piece = c.type === 'text'
        ? c.tok.v.replace(/\s+/g, ' ')
        : inlineRender([c], opts);

      if (!isDirective(c)) { cur += piece; continue; }

      if (cur === '' || /\s$/.test(cur)) flush();
      cur += piece;

      var nxt = run[i + 1];
      if (!nxt || (nxt.type === 'text' && /^\s/.test(nxt.tok.v))) flush();
    }

    flush();
    return out;
  }

  function endsWS(n) { return !!n && n.type === 'text' && /\s$/.test(n.tok.v); }
  function startsWS(n) { return !!n && n.type === 'text' && /^\s/.test(n.tok.v); }

  /**
   * Блок разворачивается на строки, если хотя бы у одной его границы
   * в исходнике есть пробел. Границы без пробела склеиваются обратно
   * при выводе — перенос строки равен пробелу, и «</span>@{end if}»
   * разрывать нельзя.
   */
  function tplBreakable(node) {
    var ch = node.children;
    if (!ch.length) return false;
    if (startsWS(ch[0])) return true;
    if (node.closeTok && endsWS(ch[ch.length - 1])) return true;
    for (var i = 0; i < ch.length; i++) {
      if (ch[i].type !== 'tplmid') continue;
      if (endsWS(ch[i - 1]) || startsWS(ch[i + 1])) return true;
    }
    return false;
  }

  /**
   * Помечает границы шаблонных блоков, у которых пробела не было:
   * такие директивы выводятся приклеенными к соседней строке.
   */
  function markGlue(node) {
    var ch = node.children || [];
    for (var i = 0; i < ch.length; i++) {
      var c = ch[i];
      if (c.type === 'tplmid') {
        c.glueL = !endsWS(ch[i - 1]);
        c.glueR = !startsWS(ch[i + 1]);
      }
      markGlue(c);
    }
    if (node.type === 'tpl' && ch.length) {
      node.glueOpen = !startsWS(ch[0]);
      node.glueClose = !!node.closeTok && !endsWS(ch[ch.length - 1]);
    }
  }

  /**
   * Узел, который можно склеить в общую строку: текст, интерполяция
   * и строчные теги, целиком состоящие из такого же содержимого.
   *
   * Перенос строки внутри строчного потокаHTML превращается в пробел,
   * поэтому «…Мос</span>ковска…» ломать нельзя ни при какой длине.
   */
  function isInlineRenderable(node) {
    if (node.type === 'text' || node.type === 'tplleaf') return true;
    // шаблонный блок с чисто строчным содержимым тоже не разрывается:
    // {% if %}5{% else %}6{% endif %} посреди текста должен остаться слитным
    if (node.type === 'tpl') {
      if (!node.closeTok) return false;
      // многострочная вставка (обычно <?php … ?>) остаётся блоком
      if (node.tok.v.indexOf('\n') !== -1 || node.closeTok.v.indexOf('\n') !== -1) return false;
      // блок с пробелами по границам раскладывается по строкам
      if (tplBreakable(node)) return false;
      for (var k = 0; k < node.children.length; k++) {
        var ch = node.children[k];
        if (ch.type === 'tplmid') continue;
        // вложенная управляющая конструкция разворачивает блок в строки
        if (isDirective(ch)) return false;
        if (!isInlineRenderable(ch)) return false;
      }
      return true;
    }
    if (node.type !== 'el') return false;
    if (!INLINE.has(node.name)) return false;
    if (RAW_TEXT.has(node.name) || PRE_TEXT.has(node.name)) return false;
    if (node.closed === false) return false;
    for (var i = 0; i < node.children.length; i++) {
      if (!isInlineRenderable(node.children[i])) return false;
    }
    return true;
  }

  function canInline(node, opts) {
    if (node.type !== 'el') return false;
    if (RAW_TEXT.has(node.name) || PRE_TEXT.has(node.name)) return false;
    for (var i = 0; i < node.children.length; i++) {
      var c = node.children[i];
      if (c.type === 'text' && !c.tok.v.trim()) continue;
      if (!isInlineRenderable(c)) return false;
    }
    return runToLines(node.children, opts).length < 2;
  }

  /**
   * trimEdges — обрезать пробелы по краям. Разрешено только там, где край
   * упирается в блочный элемент: внутри строчных тегов «<b> x </b>» пробел
   * отрисовывается, и терять его нельзя.
   */
  function inlineRender(children, opts, trimEdges) {
    var out = '';
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c.type === 'text') {
        var collapsed = c.tok.v.replace(/\s+/g, ' ');
        if (trimEdges && i === 0) collapsed = collapsed.replace(/^ /, '');
        if (trimEdges && i === children.length - 1) collapsed = collapsed.replace(/ $/, '');
        out += collapsed;
      } else if (c.type === 'tplleaf' || c.type === 'tplmid') {
        out += c.tok.v;
      } else if (c.type === 'tpl') {
        out += c.tok.v + inlineRender(c.children, opts) +
               (c.closeTok ? c.closeTok.v : '');
      } else if (c.type === 'el') {
        out += openTag(c.tok, opts) +
               (c.tok.self ? '' : inlineRender(c.children, opts) + closeTag(c, opts));
      } else if (c.type === 'comment') {
        out += c.tok.v;
      } else if (c.type === 'raw') {
        out += c.tok.v;
      }
    }
    return out;
  }

  function reindentBlock(text, pad) {
    var lines = text.replace(/\t/g, '    ').split('\n');
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return [];
    var min = Infinity;
    lines.forEach(function (l) {
      if (!l.trim()) return;
      var m = /^ */.exec(l)[0].length;
      if (m < min) min = m;
    });
    if (min === Infinity) min = 0;
    return lines.map(function (l) {
      return l.trim() ? pad + l.slice(min).replace(/\s+$/, '') : '';
    });
  }

  function beautify(src, options) {
    var opts = Object.assign({}, DEFAULTS, options || {});
    var toks = tokenize(src);
    var built = buildTree(toks);
    markGlue(built.root);
    var lines = [];
    var protectedChunks = [];

    // Закрывающий тег элемента. Если его нет в исходнике — ничего не дописываем.
    function endTag(node) {
      return node.closed ? closeTag(node, opts) : '';
    }

    function pad(d) { return opts.indent.repeat(Math.max(0, d)); }

    // Следующая строка приклеивается к предыдущей: так директива,
    // стоявшая в исходнике без пробела, не получает его при выводе.
    var glueNext = false;
    function glue(s) {
      if (!lines.length) { lines.push(s); return; }
      lines[lines.length - 1] = lines[lines.length - 1].replace(/\s+$/, '') + s;
    }
    function push(d, s) {
      if (glueNext) { glueNext = false; glue(s); return; }
      lines.push(pad(d) + s);
    }

    // Многострочная шаблонная вставка: первая строка на своём уровне,
    // продолжение — с отступом, чтобы ничего не прилипало к левому краю.
    function pushTpl(d, tok) {
      var v = tok.v;
      if (v.indexOf('\n') === -1) { push(d, squishTpl(v)); return; }

      var oneLine = v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');

      // Вставка в фигурных скобках — атомарная строка от открытия до закрытия:
      // всегда одна строка, независимо от длины, содержимое не интерпретируется.
      if (BRACE_TPL[tok.k]) { push(d, oneLine); return; }

      // Короткое выражение без строчных комментариев внутри — тоже схлопываем.
      var risky = /(^|[^:])\/\/|<!--/.test(v) || tok.k === 'php' || tok.k === 'erb';
      if (!risky && oneLine.length + pad(d).length <= opts.inlineMax) {
        push(d, oneLine);
        return;
      }

      var parts = v.split('\n');
      var tail = null;
      // одинокий закрывающий маркер возвращаем на уровень открывающего
      if (/^\s*(\?>|%>|%\}|\}|-->)\s*$/.test(parts[parts.length - 1])) {
        tail = parts.pop().trim();
      }
      push(d, parts[0].replace(/\s+$/, ''));
      reindentBlock(parts.slice(1).join('\n'), pad(d + 1)).forEach(function (l) {
        lines.push(l);
      });
      if (tail !== null) push(d, tail);
    }

    // Комментарии: если внутри разметка (в том числе условные комментарии
    // <!--[if mso]> … <![endif]-->), содержимое форматируется по вложенности.
    function renderComment(cv, d) {
      var trimmed = cv.trim();
      if (trimmed.indexOf('\n') === -1) { push(d, trimmed); return; }

      var m = /^(<!--\[[^\]]*\]>)([\s\S]*?)(<!\[endif\]\s*-->)$/i.exec(trimmed) ||
              /^(<!--)([\s\S]*?)(-->)$/.exec(trimmed);

      if (m && /<[a-zA-Z\/]/.test(m[2])) {
        push(d, m[1]);
        renderFragment(m[2], d + 1);
        push(d, m[3]);
        return;
      }

      var i = cv.indexOf('\n');
      push(d, cv.slice(0, i).trim());
      reindentBlock(cv.slice(i + 1), pad(d)).forEach(function (l) { lines.push(l); });
    }

    // Фрагмент разметки внутри комментария. Он почти всегда несбалансирован
    // (открывающая часть в одном комментарии, закрывающая — в другом),
    // поэтому блок из одних закрывающих тегов раскладывается «лесенкой».
    function renderFragment(body, d) {
      var inner = beautify(body, opts).code.replace(/\s+$/, '');
      if (!inner) return;
      var arr = inner.split('\n');
      var solid = arr.filter(function (l) { return l.trim(); });
      if (!solid.length) return;

      var allClosing = solid.every(function (l) { return /^\s*<\/[a-zA-Z]/.test(l); });
      if (allClosing) {
        for (var i = 0; i < solid.length; i++) {
          push(d + solid.length - 1 - i, solid[i].trim());
        }
        return;
      }
      for (var j = 0; j < arr.length; j++) {
        lines.push(arr[j].trim() ? pad(d) + arr[j] : '');
      }
    }

    function walk(node, d) {
      switch (node.type) {

        case 'root':
          renderChildren(node, d);
          break;

        case 'doctype':
          push(d, node.tok.v.replace(/\s+/g, ' ').trim());
          break;

        case 'text': {
          var v = node.tok.v;
          if (!v.trim()) {
            if (opts.keepBlankLines && (v.match(/\n/g) || []).length > 1) lines.push('');
            return;
          }
          var body = v.replace(/\s+/g, ' ').trim();
          push(d, body);
          break;
        }

        case 'comment':
          renderComment(node.tok.v, d);
          break;

        case 'cond':
          push(d, node.tok.v.replace(/\s+/g, ' ').trim());
          break;

        case 'stray':
          push(d, '</' + node.tok.name + '>');
          break;

        case 'tplleaf':
          pushTpl(d, node.tok);
          break;

        case 'tplmid': {
          var midV = squishTpl(node.tok.v);
          if (node.glueL && midV.indexOf('\n') === -1 && lines.length) glue(midV);
          else pushTpl(d - 1, node.tok);
          if (node.glueR) glueNext = true;
          break;
        }

        case 'tpl': {
          var kids = node.children;
          if (!kids.length) {
            pushTpl(d, node.tok);
            if (node.closeTok) glueNext = true;
          } else {
            pushTpl(d, node.tok);
            if (node.glueOpen) glueNext = true;
          }
          renderChildren(node, d + 1);
          if (node.closeTok) {
            var closeV = squishTpl(node.closeTok.v);
            if (node.glueClose && closeV.indexOf('\n') === -1 && lines.length) {
              glueNext = false;
              glue(closeV);
            } else {
              pushTpl(d, node.closeTok);
            }
          }
          break;
        }

        case 'raw':
          break; // handled by the parent element

        case 'el': {
          var tok = node.tok;
          var open = openTag(tok, opts);

          if (tok.self || tok.void) { push(d, open); return; }

          if (PRE_TEXT.has(node.name)) {
            var rawKid = node.children.find(function (c) { return c.type === 'raw'; });
            var content = rawKid ? rawKid.tok.v : inlineRender(node.children, opts);
            // byte-for-byte: never insert or drop a character inside pre/textarea
            protectedChunks.push(content);
            lines.push(pad(d) + open + SENTINEL + (protectedChunks.length - 1) + SENTINEL +
                       closeTag(node, opts));
            return;
          }

          if (RAW_TEXT.has(node.name)) {
            var rk = node.children.find(function (c) { return c.type === 'raw'; });
            var code = rk ? rk.tok.v : '';
            if (!code.trim()) { push(d, open + closeTag(node, opts)); return; }
            if (code.indexOf('\n') === -1 && code.trim().length + open.length < opts.inlineMax) {
              push(d, open + code.trim() + closeTag(node, opts));
              return;
            }
            push(d, open);
            reindentBlock(code, pad(d + 1)).forEach(function (l) { lines.push(l); });
            push(d, closeTag(node, opts));
            return;
          }

          var kids = node.children.filter(function (c) {
            return !(c.type === 'text' && !c.tok.v.trim());
          });

          if (!kids.length) { push(d, open + endTag(node)); return; }

          if (canInline(node, opts)) {
            push(d, open + inlineRender(node.children, opts, true) + endTag(node));
            return;
          }

          push(d, open);
          renderChildren(node, d + 1);
          var ct = endTag(node);
          if (ct) push(d, ct);
          break;
        }
      }
    }

    // Соседние строчные узлы собираются в одну строку. Разрывать их нельзя:
    // перенос строки в HTML равен пробелу и изменил бы отрисовку текста.
    function renderChildren(node, d) {
      var kids = node.children;
      var run = [];

      function flushRun() {
        if (!run.length) return;
        var parts = runToLines(run, opts);
        if (parts.length) parts.forEach(function (line) { push(d, line); });
        else if (opts.keepBlankLines && lines.length && lines[lines.length - 1] !== '') {
          var nl = 0;
          run.forEach(function (c) {
            if (c.type === 'text') nl += (c.tok.v.match(/\n/g) || []).length;
          });
          if (nl > 1) lines.push('');
        }
        run = [];
      }

      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (isInlineRenderable(c)) { run.push(c); continue; }
        flushRun();
        walk(c, d);
      }
      flushRun();
    }

    walk(built.root, 0);

    var out = lines.join('\n').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n');
    out = out.trim() + '\n';
    out = out.replace(new RegExp(SENTINEL + '(\\d+)' + SENTINEL, 'g'), function (_, n) {
      return protectedChunks[Number(n)];
    });
    return { code: out, warnings: built.warnings };
  }

  function squishTpl(v) {
    if (v.indexOf('\n') === -1) return v.replace(/[ \t]+/g, ' ');
    return v;
  }

  /* ---------------------------------------------------------- *
   * 8. Minifier
   * ---------------------------------------------------------- */

  function minifyCSS(css) {
    return css
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/\s+/g, ' ')
      .replace(/\s*([{}:;,>~+])\s*/g, '$1')
      .replace(/;}/g, '}')
      .trim();

  function minifyJS(js) {
    // conservative: strip indentation and blank lines only (ASI-safe)
    return js.split('\n')
      .map(function (l) { return l.replace(/^\s+/, '').replace(/\s+$/, ''); })
      .filter(function (l) { return l.length; })
      .join('\n');
  }

  // Схлопывает многострочную шаблонную вставку в одну строку, если это безопасно:
  // PHP/ERB и вставки со строчными комментариями трогать нельзя — сломается синтаксис.
  function collapseTpl(tok) {
    var v = tok.v;
    if (v.indexOf('\n') === -1) return v;
    if (BRACE_TPL[tok.k]) return v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');
    if (tok.k === 'php' || tok.k === 'erb') return v;
    if (/(^|[^:])\/\//.test(v)) return v;
    return v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');
  }

  function isBlockBoundary(tok, level) {
    if (!tok) return true;
    if (tok.t === 'open') return !INLINE.has(tok.name);
    if (tok.t === 'close') return !INLINE.has(tok.name);
    if (tok.t === 'doctype') return true;
    if (tok.t === 'comment') return true;
    if (tok.t === 'condopen' || tok.t === 'condclose') return true;
    // control-flow template blocks behave like block elements on the top level
    if (tok.t === 'tpl' && level >= 3) {
      var c = classifyTpl(tok);
      return c === 'open' || c === 'close' || c === 'mid';
    }
    return false;
  }

  /**
   * level: 1 = safe, 2 = balanced, 3 = extreme
   */
  function minify(src, level) {
    level = level || 2;
    var toks = tokenize(src);
    var out = [];
    var opts = {
      lowercase: level >= 3,
      unquote: level >= 3,
      dropAttrs: level >= 3,
      dropSlash: level >= 3
    };

    // build list of significant tokens for whitespace context
    var keep = [];
    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];
      if (tk.t === 'comment' && level >= 2 && !tk.keep &&
          !/^<!--\[if/i.test(tk.v) && !/^<!--!/.test(tk.v) && !/^<!--\s*<!\[endif/i.test(tk.v)) {
        continue;
      }
      // merge adjacent text tokens (they appear once comments are dropped)
      var last = keep[keep.length - 1];
      if (tk.t === 'text' && last && last.t === 'text') { last.v += tk.v; continue; }
      keep.push(tk);
    }

    function prevSig(idx) { return idx > 0 ? keep[idx - 1] : null; }
    function nextSig(idx) { return idx < keep.length - 1 ? keep[idx + 1] : null; }

    for (var j = 0; j < keep.length; j++) {
      var t = keep[j];

      switch (t.t) {
        case 'doctype':
          out.push(t.v.replace(/\s+/g, ' ').trim());
          break;

        case 'condopen':
        case 'condclose':
          out.push(t.v.replace(/\s+/g, ' ').trim());
          break;

        case 'comment':
          out.push(t.v.replace(/\s*\n\s*/g, level >= 2 ? ' ' : '\n'));
          break;

        case 'open':
          out.push(openTag(t, opts));
          break;

        case 'close':
          out.push('</' + (opts.lowercase || HTML_TAGS.has(t.name) ? t.name : t.rawName) + '>');
          break;

        case 'tpl':
          out.push(level >= 2 ? collapseTpl(t) : t.v);
          break;

        case 'raw': {
          if (t.name === 'pre' || t.name === 'textarea') out.push(t.v);
          else if (t.name === 'style') out.push(level >= 2 ? minifyCSS(t.v) : minifyJS(t.v));
          else if (t.name === 'script') out.push(minifyJS(t.v));
          else out.push(t.v);
          break;
        }

        case 'text': {
          var v = t.v;
          var blank = !v.trim();
          var pB = isBlockBoundary(prevSig(j), level);
          var nB = isBlockBoundary(nextSig(j), level);

          // пробел у границы блочного элемента не отрисовывается — его можно убрать
          if (blank) {
            if (pB || nB) out.push(level === 1 ? '\n' : '');
            else out.push(' ');
            break;
          }
          var collapsed = v.replace(/\s+/g, ' ');
          if (pB) collapsed = collapsed.replace(/^ /, '');
          if (nB) collapsed = collapsed.replace(/ $/, '');
          out.push(collapsed);
          break;
        }
      }
    }

    var res = out.join('');
    if (level === 1) res = res.replace(/\n{2,}/g, '\n').replace(/^\s+|\s+$/g, '');
    else res = res.replace(/^\s+|\s+$/g, '');
    return res;
  }

  /* ---------------------------------------------------------- *
   * 9. Analyser (light validation surfaced in the status bar)
   * ---------------------------------------------------------- */

  function analyze(src) {
    var built = buildTree(tokenize(src));
    var w = built.warnings.slice();
    var seenIds = Object.create(null);

    (function walk(n) {
      if (n.type === 'el') {
        var attrs = n.tok.attrs, seen = Object.create(null);
        for (var i = 0; i < attrs.length; i++) {
          var a = attrs[i];
          if (a.tpl) continue;
          var ln = (a.name || '').toLowerCase();
          if (seen[ln]) w.push({ level: 'warn', msg: 'Дубль атрибута ' + a.name + ' в <' + n.name + '>' });
          seen[ln] = 1;
          if (ln === 'id' && a.value) {
            if (seenIds[a.value]) w.push({ level: 'warn', msg: 'Повтор id="' + a.value + '"' });
            seenIds[a.value] = 1;
          }
          if (a.value === '' && (ln === 'class' || ln === 'style' || ln === 'id')) {
            w.push({ level: 'info', msg: 'Пустой атрибут ' + a.name + ' в <' + n.name + '>' });
          }
        }
        if (n.name === 'img' && !attrs.some(function (a) { return !a.tpl && (a.name || '').toLowerCase() === 'alt'; })) {
          w.push({ level: 'info', msg: '<img> без alt' });
        }
      }
      (n.children || []).forEach(walk);
    })(built.root);

    return w;
  }

  /* ---------------------------------------------------------- *
   * 10. Типографика
   * ---------------------------------------------------------- */

  // Внутри этих тегов текст не трогаем — там важен каждый символ
  var NO_TYPO = new Set(['code', 'kbd', 'samp', 'var', 'tt', 'pre', 'textarea', 'script', 'style']);

  // Предлоги, союзы, частицы и местоимения, которые нельзя оставлять в конце
  // строки. Список явный: правило «любое слово из 1-2 букв» цепляло бы
  // и единицы измерения — «20 см ©».
  var SHORT_WORDS = 'а|и|в|к|о|с|у|я|б|ж|во|ко|со|об|обо|на|за|из|от|до|по|про|для|' +
    'не|ни|но|да|же|ли|бы|то|уж|аж|под|над|при|без|вне|как|что|чем|где|уже|или|' +
    'мы|ты|вы|он|их|им|её|ее|ей|его|наш|мой|все|всё|это|эта|тот|та|те';

  var MASK = '\u0001';   // заглушка для HTML-сущностей
  var NB = '\u0002';     // неразрывный пробел до подстановки

  /**
   * Русская типографика для текстовых узлов.
   * Возвращает { code, count } — новый исходник и число замен.
   */
  function typography(src, options) {
    var opts = options || {};
    var nbsp = opts.nbsp === 'char' ? '\u00A0' : '&nbsp;';
    var toks = tokenize(src);
    var out = '', last = 0, skip = 0;
    var st = { n: 0, depth: 0 };

    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];

      if (t.t === 'open' && NO_TYPO.has(t.name) && !t.self) { skip++; continue; }
      if (t.t === 'close' && NO_TYPO.has(t.name) && skip) { skip--; continue; }
      if (t.t !== 'text' || skip) continue;
      if (!/\S/.test(t.v)) continue;

      var res = typoText(t.v, nbsp, st);
      if (res === t.v) continue;
      out += src.slice(last, t.s) + res;
      last = t.e;
    }
    out += src.slice(last);
    return { code: out, count: st.n };
  }

  function typoText(v, nbsp, st) {
    var ent = [];

    // сущности прячем целиком: правила не должны в них лезть
    v = v.replace(/&(?:[a-zA-Z][a-zA-Z0-9]{1,10}|#\d{1,5}|#x[0-9a-fA-F]{1,5});/g, function (m) {
      ent.push(m);
      return MASK + (ent.length - 1) + MASK;
    });

    function apply(re, to) {
      var m = v.match(re);
      if (!m) return;
      st.n += m.length;
      v = v.replace(re, to);
    }

    apply(/[ \t]{2,}/g, ' ');                       // двойные пробелы
    apply(/[ \t]+([,.!?;:])/g, '$1');               // пробел перед знаком препинания
    apply(/\.{3,}/g, '…');                          // многоточие
    apply(/\(c\)/gi, '©');
    apply(/\(r\)/gi, '®');
    apply(/\(tm\)/gi, '™');
    apply(/\+-/g, '±');
    apply(/(\d)\s*[xх]\s*(\d)/g, '$1×$2');          // 10 x 20 → 10 × 20

    // кавычки: внешние «ёлочки», вложенные „лапки“
    apply(new RegExp('(^|[\\s' + NB + '(\\[{—–-])"', 'g'), function (m, p) {
      st.depth++;
      return p + (st.depth > 1 ? '„' : '«');
    });
    apply(/"/g, function () {
      var ch = st.depth > 1 ? '“' : '»';
      if (st.depth) st.depth--;
      return ch;
    });

    apply(/(^|[\s])-{1,2}([\s])/g, '$1—$2');        // дефис между словами → тире
    apply(new RegExp('([^\\s' + NB + '])[ \\t]+—', 'g'), '$1' + NB + '—');
    apply(/(\d{1,4})-(\d{1,4})(?![\d-])/g, '$1–$2');       // диапазон через короткое тире

    apply(/([№§])[ \t]+/g, '$1' + NB);
    apply(/(\d)[ \t](?=\d{3}(?!\d))/g, '$1' + NB);         // 100 000
    apply(/(\d)[ \t]+(?=[а-яёa-z%°])/gi, '$1' + NB);       // 10 кг, 5 %
    apply(/([А-ЯЁ]\.)[ \t]*([А-ЯЁ]\.)[ \t]*(?=[А-ЯЁ])/g, '$1' + NB + '$2' + NB);

    // Предлоги и союзы не отрываем от следующего слова. Список явный:
    // «любое слово из 1-2 букв» цепляло бы и единицы измерения — «20 см ©».
    var short = new RegExp(
      '(^|[\\s' + NB + '(«„])(' + SHORT_WORDS + ')[ \\t]+', 'gi');
    for (var pass = 0; pass < 3; pass++) apply(short, '$1$2' + NB);

    v = v.split(NB).join(nbsp);
    return v.replace(new RegExp(MASK + '(\\d+)' + MASK, 'g'), function (m, k) {
      return ent[Number(k)];
    });
  }

  return {
    tokenize: tokenize,
    beautify: beautify,
    minify: minify,
    analyze: analyze,
    typography: typography,
    VOID: VOID,
    INLINE: INLINE
  };
});
