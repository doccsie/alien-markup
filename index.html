<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIEN MARKUP — форматтер и минификатор HTML</title>
<meta name="description" content="Форматирование и сжатие HTML-верстки с поддержкой шаблонизаторов: Blade, Twig, Jinja, ERB, Mustache, PHP.">

<meta name="theme-color" content="#070b09">
<style>
/* ============================================================
   ALIEN MARKUP — retrofuture CRT console
   ============================================================ */
:root{
  --font:"Berkeley Mono","JetBrains Mono","IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:14px;
  --err:#ff5f56;
  --warn:#ffb648;
  --glow:6px; --scan:.22; --vig:.55; --gridsize:34px;
  --code:11px;
}

/* ALIEN — фосфорный ЭЛТ */
html[data-theme="alien"]{
  --bg:#070b09; --bg-2:#0b120e; --panel:#0a100d;
  --ph:#4dffa6; --ph-dim:#1f7a53; --ph-ghost:#0f2a20;
  --a2:#ffb648; --led:#4dffa6; --grid:rgba(77,255,166,.07);
}
/* VAULT — янтарный терминал убежища */
html[data-theme="vault"]{
  --bg:#0a0704; --bg-2:#120d07; --panel:#100b06;
  --ph:#ffb648; --ph-dim:#8a5c15; --ph-ghost:#2a1e08;
  --a2:#7dff9b; --led:#ffb648; --grid:rgba(255,182,72,.07);
  --glow:7px; --scan:.25; --vig:.6;
}
/* SOLARIS — холодная станция */
html[data-theme="solaris"]{
  --bg:#050a0d; --bg-2:#081116; --panel:#070f14;
  --ph:#7ad7ff; --ph-dim:#2a6e8c; --ph-ghost:#0c2530;
  --a2:#d8f2ff; --led:#7ad7ff; --grid:rgba(122,215,255,.07);
  --glow:5px; --scan:.18; --vig:.5;
}
/* REPLICANT — неоновый нуар */
html[data-theme="replicant"]{
  --bg:#0a0714; --bg-2:#0f0a1c; --panel:#0c0818;
  --ph:#22d3ee; --ph-dim:#4a3a7a; --ph-ghost:#1a1230;
  --a2:#ff2e88; --led:#ff2e88; --grid:rgba(255,46,136,.06);
  --glow:11px; --scan:.12; --vig:.62; --gridsize:44px;
}
/* GRID — световая сетка */
html[data-theme="grid"]{
  --bg:#000306; --bg-2:#03080c; --panel:#02060a;
  --ph:#00e5ff; --ph-dim:#0d5f75; --ph-ghost:#04212b;
  --a2:#ff8a00; --led:#ff8a00; --grid:rgba(0,229,255,.09);
  --glow:9px; --scan:.08; --vig:.5; --gridsize:28px;
}
/* ZION — цифровой дождь */
html[data-theme="zion"]{
  --bg:#000600; --bg-2:#020a02; --panel:#010801;
  --ph:#00ff41; --ph-dim:#0a6b1e; --ph-ghost:#04220a;
  --a2:#d4ffd4; --led:#00ff41; --grid:rgba(0,255,65,.05);
  --glow:8px; --scan:.3; --vig:.6;
}
/* MONOLITH — светлая, дневная */
html[data-theme="monolith"]{
  --bg:#eceae4; --bg-2:#f6f5f2; --panel:#f6f5f2;
  --ph:#16150f; --ph-dim:#a8a498; --ph-ghost:#dedbd2;
  --a2:#e8341c; --led:#e8341c; --grid:rgba(22,21,15,.05);
  --glow:0px; --scan:.045; --vig:.08;
}
html[data-theme="monolith"] #app{animation:none}
html[data-theme="monolith"] #crt::before{mix-blend-mode:normal}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ph);
  font-family:var(--font); font-size:13px; line-height:1.5;
  overflow:hidden;
  text-shadow:0 0 var(--glow) color-mix(in srgb, var(--ph) 35%, transparent);
  transition:background .25s linear, color .25s linear;
}

/* --- CRT overlays --- */
#crt{position:fixed; inset:0; pointer-events:none; z-index:99}
#crt::before{ /* scanlines */
  content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(to bottom,
    rgba(0,0,0,0) 0 2px, rgba(0,0,0,var(--scan)) 2px 3px);
  mix-blend-mode:multiply;
}
#crt::after{ /* vignette + glass */
  content:""; position:absolute; inset:0;
  background:
    radial-gradient(120% 100% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,var(--vig)) 100%),
    linear-gradient(120deg, rgba(255,255,255,.03) 0%, rgba(255,255,255,0) 40%);
}
#rain{
  position:fixed; inset:0; z-index:98; pointer-events:none;
  opacity:0; transition:opacity .5s linear; mix-blend-mode:screen;
}
html[data-theme="zion"] #rain{opacity:.16}
@keyframes flick{0%,97%,100%{opacity:1}98%{opacity:.965}99%{opacity:.985}}
#app{animation:flick 7s infinite steps(1,end)}

/* --- layout --- */
#app{height:100%; display:flex; flex-direction:column; position:relative; z-index:1;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px),
                   linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:var(--gridsize) var(--gridsize);
}

header{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:10px 16px; border-bottom:1px solid var(--ph-dim);
  background:linear-gradient(180deg, var(--bg-2), transparent);
}
.brand{display:flex; align-items:baseline; gap:12px}
.brand h1{
  margin:0; font-size:17px; font-weight:400; letter-spacing:.34em;
  text-transform:uppercase;
}
.brand .ver{font-size:10px; letter-spacing:.22em; color:var(--ph-dim)}
.leds{display:flex; gap:14px; margin-left:auto; align-items:center; flex-wrap:wrap}
.led{display:flex; align-items:center; gap:6px; font-size:10px; letter-spacing:.18em;
  color:var(--ph-dim); text-transform:uppercase}
.led b{
  width:7px; height:7px; background:var(--led); display:block;
  box-shadow:0 0 8px var(--led); animation:pulse 2.4s infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.led.off b{background:var(--ph-ghost); box-shadow:none; animation:none}

/* --- палитра тем --- */
.palette{position:relative}
.palette>button{display:flex; align-items:center; gap:8px}
.chip{width:9px; height:9px; display:block; border:1px solid rgba(0,0,0,.35)}
.menu{
  position:absolute; top:calc(100% + 7px); right:0; z-index:120; min-width:212px;
  background:var(--bg-2); border:1px solid var(--ph); padding:4px;
  box-shadow:0 0 26px -8px var(--ph); display:none;
}
.menu.open{display:block}
.menu button{
  display:flex; align-items:center; gap:9px; width:100%; border:0; text-align:left;
  padding:8px 9px; letter-spacing:.14em;
}
.menu button:hover{background:var(--ph-ghost); box-shadow:none}
.menu button[aria-current="true"]{background:var(--ph); color:var(--bg); text-shadow:none}
.menu .sub{margin-left:auto; font-size:9.5px; letter-spacing:.1em; opacity:.65; text-transform:none}

/* --- toolbar --- */
.toolbar{
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
  padding:9px 16px; border-bottom:1px solid var(--ph-dim);
  background:rgba(0,0,0,.25);
}
button, .seg span, select{
  font-family:inherit; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  background:transparent; color:var(--ph); border:1px solid var(--ph-dim);
  padding:7px 13px; cursor:pointer; position:relative;
  transition:background .12s linear, color .12s linear, box-shadow .12s linear;
}
button:hover, .seg span:hover{background:var(--ph-ghost); box-shadow:0 0 12px -2px var(--ph)}
button:active{transform:translateY(1px)}
button.primary{border-color:var(--ph); box-shadow:inset 0 0 0 1px rgba(0,0,0,.4), 0 0 14px -6px var(--ph)}
button.primary:hover{background:var(--ph); color:var(--bg); text-shadow:none}
button:disabled{opacity:.35; cursor:not-allowed}

/* кнопка починки: тревожное свечение, когда есть что чинить */
#btnFix{transition:border-color .2s, color .2s, box-shadow .2s}
#btnFix.alert{
  border-color:var(--err); color:var(--err);
  animation:alarm 1.5s ease-in-out infinite;
}
#btnFix.alert:hover{background:var(--err); color:var(--bg); text-shadow:none; animation:none}
@keyframes alarm{
  0%,100%{box-shadow:0 0 0 0 transparent}
  50%{box-shadow:0 0 18px -2px var(--err), inset 0 0 12px -6px var(--err)}
}
#fixCount{
  display:none; margin-left:7px; padding:1px 6px; font-size:10px;
  background:var(--err); color:var(--bg); text-shadow:none;
}
#btnFix.alert #fixCount{display:inline}
.seg{display:flex; border:1px solid var(--ph-dim)}
.seg span{border:0; border-right:1px solid var(--ph-dim); user-select:none}
.seg span:last-child{border-right:0}
.seg span[aria-selected="true"]{background:var(--ph); color:var(--bg); text-shadow:none}
.sep{width:1px; height:22px; background:var(--ph-dim); opacity:.6}
.label{font-size:10px; letter-spacing:.2em; color:var(--ph-dim); text-transform:uppercase}
select{padding:6px 8px}
select option{background:var(--bg-2); color:var(--ph)}
.spacer{margin-left:auto}

/* --- panels --- */
main{flex:1; display:grid; grid-template-columns:1fr 1fr; gap:0; min-height:0}
.pane{display:flex; flex-direction:column; min-width:0; min-height:0; position:relative;
  border-right:1px solid var(--ph-dim); background:var(--panel)}
.pane:last-child{border-right:0}
.pane-head{
  display:flex; align-items:center; gap:10px; padding:7px 12px;
  border-bottom:1px solid var(--ph-dim); font-size:10px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--ph-dim); background:rgba(0,0,0,.35);
}
.pane-head .dot{width:5px;height:5px;background:var(--ph);box-shadow:0 0 6px var(--ph)}
.pane-head .meta{margin-left:auto; font-size:10px; letter-spacing:.14em}
.editor{flex:1; display:flex; min-height:0; position:relative}
.gutter{
  padding:8px 7px 8px 10px; text-align:right; color:var(--ph-dim);
  font-size:var(--code); line-height:1.45; user-select:none; overflow:hidden;
  border-right:1px solid var(--ph-ghost); background:rgba(0,0,0,.25);
  min-width:40px; white-space:pre; text-shadow:none;
}
textarea{
  flex:1; width:100%; resize:none; border:0; outline:0; padding:8px 11px;
  background:transparent; color:var(--ph); font-family:inherit;
  font-size:var(--code); line-height:1.45; white-space:pre; overflow:auto;
  caret-color:var(--ph); tab-size:2;
}
textarea::placeholder{color:var(--ph-dim); opacity:.7}
textarea::selection{background:var(--ph); color:var(--bg); text-shadow:none}
textarea::-webkit-scrollbar{width:10px;height:10px}
textarea::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
textarea::-webkit-scrollbar-thumb{background:var(--ph-ghost); border:1px solid var(--ph-dim)}
textarea::-webkit-scrollbar-thumb:hover{background:var(--ph-dim)}

.corner{position:absolute; width:9px; height:9px; border:1px solid var(--ph-dim); pointer-events:none}
.c-tl{top:4px;left:4px;border-right:0;border-bottom:0}
.c-tr{top:4px;right:4px;border-left:0;border-bottom:0}
.c-bl{bottom:4px;left:4px;border-right:0;border-top:0}
.c-br{bottom:4px;right:4px;border-left:0;border-top:0}

/* --- diagnostics --- */
#diag{
  max-height:150px; overflow:auto; border-top:1px solid var(--ph-dim);
  padding:8px 12px; font-size:11px; background:rgba(0,0,0,.4); display:none;
}
#diag.show{display:block}
#diag .row{display:flex; gap:8px; padding:2px 0}
#diag .row .tag{min-width:52px; font-size:9.5px; letter-spacing:.16em; opacity:.9}
.lvl-err{color:var(--err)} .lvl-warn{color:var(--warn)} .lvl-info{color:var(--ph-dim)}
.lvl-fix{color:var(--ph)}

/* --- status bar --- */
footer{
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
  padding:7px 16px; border-top:1px solid var(--ph-dim);
  font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ph-dim);
  background:linear-gradient(0deg, var(--bg-2), transparent);
}
footer b{color:var(--ph); font-weight:400}
.cursor{display:inline-block; width:7px; height:12px; background:var(--ph);
  vertical-align:-2px; animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* --- drop zone --- */
#drop{
  position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
  background:rgba(0,0,0,.82); border:2px dashed var(--ph);
  font-size:15px; letter-spacing:.3em; text-transform:uppercase;
}
#drop.show{display:flex}

/* --- toast --- */
#toast{
  position:fixed; bottom:44px; left:50%; transform:translateX(-50%) translateY(14px);
  z-index:120; padding:9px 18px; border:1px solid var(--ph); background:var(--bg-2);
  font-size:11px; letter-spacing:.2em; text-transform:uppercase; opacity:0;
  transition:opacity .18s, transform .18s; pointer-events:none;
  box-shadow:0 0 22px -6px var(--ph);
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

@media (max-width:900px){
  main{grid-template-columns:1fr; grid-template-rows:1fr 1fr}
  .pane{border-right:0; border-bottom:1px solid var(--ph-dim)}
  .brand h1{font-size:14px; letter-spacing:.2em}
  body{overflow:auto}
}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div id="crt"></div>
<div id="drop">▚ отпустите файл — загрузим в буфер ▚</div>
<div id="toast"></div>

<div id="app">

  <header>
    <div class="brand">
      <h1 id="brandName">Alien Markup</h1>
      <span class="ver">unit 2.1 / semiotic markup processor</span>
    </div>
    <div class="leds">
      <span class="led"><b></b>core</span>
      <span class="led" id="ledParse"><b></b>parser</span>
      <span class="led off" id="ledErr"><b></b>errors</span>
      <div class="palette">
        <button id="themeBtn" aria-haspopup="true" aria-expanded="false" title="Оформление (Ctrl+Shift+T)">
          <span class="chip" id="themeChip"></span><span id="themeLabel">alien</span> ▾
        </button>
        <div class="menu" id="themeMenu" role="menu"></div>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <button class="primary" id="btnFormat">▶ форматировать</button>
    <button id="btnMinify">▼ сжать</button>
    <button id="btnFix" title="Дописать пропущенные теги и скобки">
      ⚕ починить теги<span id="fixCount">0</span>
    </button>
    <div class="seg" id="levelSeg" role="tablist" title="Степень сжатия">
      <span role="tab" data-lv="1">L1 safe</span>
      <span role="tab" data-lv="2" aria-selected="true">L2 balanced</span>
      <span role="tab" data-lv="3">L3 extreme</span>
    </div>
    <div class="sep"></div>
    <span class="label">отступ</span>
    <select id="indentSel">
      <option value="2">2 пробела</option>
      <option value="4">4 пробела</option>
      <option value="tab">таб</option>
    </select>
    <div class="sep"></div>
    <button id="btnSample">образец</button>
    <button id="btnSwap">↺ в ввод</button>
    <button id="btnClear">очистить</button>
    <div class="spacer"></div>
    <button id="btnCopy">копировать</button>
    <button id="btnDownload">скачать</button>
  </div>

  <main>
    <section class="pane">
      <div class="pane-head">
        <span class="dot"></span><span>input // исходная верстка</span>
        <span class="meta" id="inMeta">0 симв · 0 стр</span>
      </div>
      <div class="editor">
        <div class="gutter" id="gutIn">1</div>
        <textarea id="input" spellcheck="false" autocomplete="off"
          placeholder="Вставьте HTML сюда, либо перетащите файл в окно…"></textarea>
      </div>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
    </section>

    <section class="pane">
      <div class="pane-head">
        <span class="dot"></span><span>output // результат</span>
        <span class="meta" id="outMeta">—</span>
      </div>
      <div class="editor">
        <div class="gutter" id="gutOut">1</div>
        <textarea id="output" spellcheck="false" autocomplete="off" readonly></textarea>
      </div>
      <div id="diag"></div>
      <span class="corner c-bl"></span><span class="corner c-br"></span>
    </section>
  </main>

  <footer>
    <span>статус: <b id="stStatus">ожидание</b><span class="cursor"></span></span>
    <span>режим: <b id="stMode">—</b></span>
    <span>экономия: <b id="stSave">—</b></span>
    <span>диагностика: <b id="stDiag">0</b></span>
    <span class="spacer"></span>
    <span>за сегодня: <b id="stToday">0</b></span>
    <span>всего: <b id="stTotal">0</b></span>
    <span>сессия: <b id="stSession">0</b></span>
  </footer>
</div>

<!-- ENGINE:START (собрано из engine.js командой: node build.js) -->
<script>
/* =============================================================
 *  ALIEN MARKUP — engine.js
 *  HTML beautifier / minifier with template-language awareness.
 *  Zero dependencies. Works in the browser and in Node.
 * ============================================================= */
(function (root, factory) {
  var api = factory();
  if (typeof module === 'object' && module.exports) module.exports = api;

  var RAW_TEXT = new Set(['script', 'style']);      // content preserved, re-indented
  var PRE_TEXT = new Set(['pre', 'textarea']);      // content preserved byte-for-byte

  var INLINE = new Set(('a abbr acronym b bdi bdo big br button cite code data datalist ' +
    'del dfn em font i img input ins kbd label map mark meter noscript object output ' +
    'picture progress q ruby s samp select small span strike strong sub sup svg template ' +
    'textarea time tt u var video audio wbr').split(' '));

  var HTML_TAGS = new Set(('a abbr address area article aside audio b base bdi bdo big ' +
    'blockquote body br button canvas caption cite code col colgroup data datalist dd del ' +
    'details dfn dialog div dl dt em embed fieldset figcaption figure footer form h1 h2 h3 ' +
    'h4 h5 h6 head header hgroup hr html i iframe img input ins kbd label legend li link ' +
    'main map mark menu meta meter nav noscript object ol optgroup option output p param ' +
    'picture pre progress q rp rt ruby s samp script search section select slot small source ' +
    'span strong style sub summary sup table tbody td template textarea tfoot th thead time ' +
    'title tr track u ul var video wbr').split(' '));

  var BOOLEAN_ATTRS = new Set(('allowfullscreen async autofocus autoplay checked controls ' +
    'default defer disabled formnovalidate hidden inert ismap itemscope loop multiple muted ' +
    'nomodule novalidate open playsinline readonly required reversed selected').split(' '));

  /* ---------------------------------------------------------- *
   * 2. Template language detection
   * ---------------------------------------------------------- */

  // Blade / generic at-directives that open a nesting level

  /* ---------------------------------------------------------- *

  function netBraces(s) {

    for (var f = stack.length - 1; f > 0; f--) {

  // Закрывающий тег выводится только если он реально был в исходнике:

  function closeTag(node, opts) {
    if (node.closed === false) return '';
    return '</' + tagName(node.tok, opts) + '>';
  }

  /* ---------------------------------------------------------- *
   * 7. Beautifier
   * ---------------------------------------------------------- */

  var SENTINEL = '';   // private-use char: never appears in real markup

  // Вставки в фигурных скобках считаем атомарной строкой: всегда одна строка,
  // содержимое не разбирается и не переносится.
  var BRACE_TPL = { atbrace: 1, interp: 1, mustache: 1, curly: 1 };

  var DEFAULTS = {
    indent: '  ',
    inlineMax: 100,
    keepBlankLines: false,
    lowercase: false
  };

  /**
   * Узел, который можно склеить в общую строку: текст, интерполяция
   * и строчные теги, целиком состоящие из такого же содержимого.
   *
   * Перенос строки внутри строчного потокаHTML превращается в пробел,
   * поэтому «…Мос</span>ковска…» ломать нельзя ни при какой длине.
   */
  function isInlineRenderable(node) {
    if (node.type === 'text' || node.type === 'tplleaf') return true;
    // шаблонный блок с чисто строчным содержимым тоже не разрывается:
    // {% if %}5{% else %}6{% endif %} посреди текста должен остаться слитным
    if (node.type === 'tpl') {
      if (!node.closeTok) return false;
      // многострочная вставка (обычно <?php … ?>) остаётся блоком
      if (node.tok.v.indexOf('\n') !== -1 || node.closeTok.v.indexOf('\n') !== -1) return false;
      for (var k = 0; k < node.children.length; k++) {
        var ch = node.children[k];
        if (ch.type === 'tplmid') continue;
        if (!isInlineRenderable(ch)) return false;
      }
      return true;
    }
    if (node.type !== 'el') return false;
    if (!INLINE.has(node.name)) return false;
    if (RAW_TEXT.has(node.name) || PRE_TEXT.has(node.name)) return false;
    if (node.closed === false) return false;
    for (var i = 0; i < node.children.length; i++) {
      if (!isInlineRenderable(node.children[i])) return false;
    }
    return true;
  }

  function canInline(node) {
    if (node.type !== 'el') return false;
    if (RAW_TEXT.has(node.name) || PRE_TEXT.has(node.name)) return false;
    for (var i = 0; i < node.children.length; i++) {
      var c = node.children[i];
      if (c.type === 'text' && !c.tok.v.trim()) continue;
      if (!isInlineRenderable(c)) return false;
    }
    return true;
  }

  /**
   * trimEdges — обрезать пробелы по краям. Разрешено только там, где край
   * упирается в блочный элемент: внутри строчных тегов «<b> x </b>» пробел
   * отрисовывается, и терять его нельзя.
   */
  function inlineRender(children, opts, trimEdges) {
    var out = '';
    for (var i = 0; i < children.length; i++) {
      var c = children[i];
      if (c.type === 'text') {
        var collapsed = c.tok.v.replace(/\s+/g, ' ');
        if (trimEdges && i === 0) collapsed = collapsed.replace(/^ /, '');
        if (trimEdges && i === children.length - 1) collapsed = collapsed.replace(/ $/, '');
        out += collapsed;
      } else if (c.type === 'tplleaf' || c.type === 'tplmid') {
        out += c.tok.v;
      } else if (c.type === 'tpl') {
        out += c.tok.v + inlineRender(c.children, opts) +
               (c.closeTok ? c.closeTok.v : '');
      } else if (c.type === 'el') {
        out += openTag(c.tok, opts) +
               (c.tok.self ? '' : inlineRender(c.children, opts) + closeTag(c, opts));
      } else if (c.type === 'comment') {
        out += c.tok.v;
      } else if (c.type === 'raw') {
        out += c.tok.v;
      }
    }
    return out;
  }

  function reindentBlock(text, pad) {
    var lines = text.replace(/\t/g, '    ').split('\n');
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return [];
    var min = Infinity;
    lines.forEach(function (l) {
      if (!l.trim()) return;
      var m = /^ */.exec(l)[0].length;
      if (m < min) min = m;
    });
    if (min === Infinity) min = 0;
    return lines.map(function (l) {
      return l.trim() ? pad + l.slice(min).replace(/\s+$/, '') : '';
    });
  }

  function beautify(src, options) {
    var opts = Object.assign({}, DEFAULTS, options || {});
    var toks = tokenize(src);
    var built = buildTree(toks);
    var lines = [];
    var protectedChunks = [];
    var fixes = [];

    // Закрывающий тег элемента. В режиме починки дописывает отсутствующий.
    function endTag(node) {
      if (node.closed) return closeTag(node, opts);
      if (!opts.fix) return '';
      fixes.push({ level: 'fix', msg: 'Дописан </' + node.name + '>' });
      return '</' + tagName(node.tok, opts) + '>';
    }

    function pad(d) { return opts.indent.repeat(Math.max(0, d)); }
    function push(d, s) { lines.push(pad(d) + s); }

    // Многострочная шаблонная вставка: первая строка на своём уровне,
    // продолжение — с отступом, чтобы ничего не прилипало к левому краю.
    function pushTpl(d, tok) {
      var v = tok.v;
      if (v.indexOf('\n') === -1) { push(d, squishTpl(v)); return; }

      var oneLine = v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');

      // Вставка в фигурных скобках — атомарная строка от открытия до закрытия:
      // всегда одна строка, независимо от длины, содержимое не интерпретируется.
      if (BRACE_TPL[tok.k]) { push(d, oneLine); return; }

      // Короткое выражение без строчных комментариев внутри — тоже схлопываем.
      var risky = /(^|[^:])\/\/|<!--/.test(v) || tok.k === 'php' || tok.k === 'erb';
      if (!risky && oneLine.length + pad(d).length <= opts.inlineMax) {
        push(d, oneLine);
        return;
      }

      var parts = v.split('\n');
      var tail = null;
      // одинокий закрывающий маркер возвращаем на уровень открывающего
      if (/^\s*(\?>|%>|%\}|\}|-->)\s*$/.test(parts[parts.length - 1])) {
        tail = parts.pop().trim();
      }
      push(d, parts[0].replace(/\s+$/, ''));
      reindentBlock(parts.slice(1).join('\n'), pad(d + 1)).forEach(function (l) {
        lines.push(l);
      });
      if (tail !== null) push(d, tail);
    }

    // Комментарии: если внутри разметка (в том числе условные комментарии
    // <!--[if mso]> … <![endif]-->), содержимое форматируется по вложенности.
    function renderComment(cv, d) {
      var trimmed = cv.trim();
      if (trimmed.indexOf('\n') === -1) { push(d, trimmed); return; }

      var m = /^(<!--\[[^\]]*\]>)([\s\S]*?)(<!\[endif\]\s*-->)$/i.exec(trimmed) ||
              /^(<!--)([\s\S]*?)(-->)$/.exec(trimmed);

      if (m && /<[a-zA-Z\/]/.test(m[2])) {
        push(d, m[1]);
        renderFragment(m[2], d + 1);
        push(d, m[3]);
        return;
      }

      var i = cv.indexOf('\n');
      push(d, cv.slice(0, i).trim());
      reindentBlock(cv.slice(i + 1), pad(d)).forEach(function (l) { lines.push(l); });
    }

    // Фрагмент разметки внутри комментария. Он почти всегда несбалансирован
    // (открывающая часть в одном комментарии, закрывающая — в другом),
    // поэтому блок из одних закрывающих тегов раскладывается «лесенкой».
    function renderFragment(body, d) {
      var inner = beautify(body, opts).code.replace(/\s+$/, '');
      if (!inner) return;
      var arr = inner.split('\n');
      var solid = arr.filter(function (l) { return l.trim(); });
      if (!solid.length) return;

      var allClosing = solid.every(function (l) { return /^\s*<\/[a-zA-Z]/.test(l); });
      if (allClosing) {
        for (var i = 0; i < solid.length; i++) {
          push(d + solid.length - 1 - i, solid[i].trim());
        }
        return;
      }
      for (var j = 0; j < arr.length; j++) {
        lines.push(arr[j].trim() ? pad(d) + arr[j] : '');
      }
    }

    function walk(node, d) {
      switch (node.type) {

        case 'root':
          renderChildren(node, d);
          break;

        case 'doctype':
          push(d, node.tok.v.replace(/\s+/g, ' ').trim());
          break;

        case 'text': {
          var v = node.tok.v;
          if (!v.trim()) {
            if (opts.keepBlankLines && (v.match(/\n/g) || []).length > 1) lines.push('');
            return;
          }
          var body = v.replace(/\s+/g, ' ').trim();
          push(d, body);
          break;
        }

        case 'comment':
          renderComment(node.tok.v, d);
          break;

        case 'cond':
          push(d, node.tok.v.replace(/\s+/g, ' ').trim());
          break;

        case 'stray':
          if (opts.fix) {
            fixes.push({ level: 'fix', msg: 'Удалён лишний </' + node.tok.name + '>' });
            return;
          }
          push(d, '</' + node.tok.name + '>');
          break;

        case 'tplleaf':
          pushTpl(d, node.tok);
          break;

        case 'tplmid':
          pushTpl(d - 1, node.tok);
          break;

        case 'tpl': {
          pushTpl(d, node.tok);
          renderChildren(node, d + 1);
          if (node.closeTok) pushTpl(d, node.closeTok);
          break;
        }

        case 'raw':
          break; // handled by the parent element

        case 'el': {
          var tok = node.tok;
          var open = openTag(tok, opts);

          if (tok.self || tok.void) { push(d, open); return; }

          if (PRE_TEXT.has(node.name)) {
            var rawKid = node.children.find(function (c) { return c.type === 'raw'; });
            var content = rawKid ? rawKid.tok.v : inlineRender(node.children, opts);
            // byte-for-byte: never insert or drop a character inside pre/textarea
            protectedChunks.push(content);
            lines.push(pad(d) + open + SENTINEL + (protectedChunks.length - 1) + SENTINEL +
                       closeTag(node, opts));
            return;
          }

          if (RAW_TEXT.has(node.name)) {
            var rk = node.children.find(function (c) { return c.type === 'raw'; });
            var code = rk ? rk.tok.v : '';
            if (!code.trim()) { push(d, open + closeTag(node, opts)); return; }
            if (code.indexOf('\n') === -1 && code.trim().length + open.length < opts.inlineMax) {
              push(d, open + code.trim() + closeTag(node, opts));
              return;
            }
            push(d, open);
            reindentBlock(code, pad(d + 1)).forEach(function (l) { lines.push(l); });
            push(d, closeTag(node, opts));
            return;
          }

          var kids = node.children.filter(function (c) {
            return !(c.type === 'text' && !c.tok.v.trim());
          });

          if (!kids.length) { push(d, open + endTag(node)); return; }

          if (canInline(node)) {
            push(d, open + inlineRender(node.children, opts, true) + endTag(node));
            return;
          }

          push(d, open);
          renderChildren(node, d + 1);
          var ct = endTag(node);
          if (ct) push(d, ct);
          break;
        }
      }
    }

    // Соседние строчные узлы собираются в одну строку. Разрывать их нельзя:
    // перенос строки в HTML равен пробелу и изменил бы отрисовку текста.
    function renderChildren(node, d) {
      var kids = node.children;
      var run = [];

      function flushRun() {
        if (!run.length) return;
        var s = inlineRender(run, opts, true).trim();
        if (s) push(d, s);
        else if (opts.keepBlankLines && lines.length && lines[lines.length - 1] !== '') {
          var nl = 0;
          run.forEach(function (c) {
            if (c.type === 'text') nl += (c.tok.v.match(/\n/g) || []).length;
          });
          if (nl > 1) lines.push('');
        }
        run = [];
      }

      for (var i = 0; i < kids.length; i++) {
        var c = kids[i];
        if (isInlineRenderable(c)) { run.push(c); continue; }
        flushRun();
        walk(c, d);
      }
      flushRun();
    }

    walk(built.root, 0);

    var out = lines.join('\n').replace(/[ \t]+$/gm, '').replace(/\n{3,}/g, '\n\n');
    out = out.trim() + '\n';
    out = out.replace(new RegExp(SENTINEL + '(\\d+)' + SENTINEL, 'g'), function (_, n) {
      return protectedChunks[Number(n)];
    });
    if (opts.fix) {
      toks.forEach(function (t) {
        if (t.t === 'open' && t.unterminated) {
          fixes.push({ level: 'fix', msg: 'Дописан «>» у <' + t.name + '>' });
        }
      });
    }
    return { code: out, warnings: built.warnings, fixes: fixes };
  }

  function squishTpl(v) {
    if (v.indexOf('\n') === -1) return v.replace(/[ \t]+/g, ' ');
    return v;
  }

  /* ---------------------------------------------------------- *
   * 8. Minifier
   * ---------------------------------------------------------- */

  function minifyCSS(css) {
    return css
      .replace(/\/\*[\s\S]*?\*\//g, '')
      .replace(/\s+/g, ' ')
      .replace(/\s*([{}:;,>~+])\s*/g, '$1')
      .replace(/;}/g, '}')
      .trim();
  }

  function minifyJS(js) {
    // conservative: strip indentation and blank lines only (ASI-safe)
    return js.split('\n')
      .map(function (l) { return l.replace(/^\s+/, '').replace(/\s+$/, ''); })
      .filter(function (l) { return l.length; })
      .join('\n');
  }

  // Схлопывает многострочную шаблонную вставку в одну строку, если это безопасно:
  // PHP/ERB и вставки со строчными комментариями трогать нельзя — сломается синтаксис.
  function collapseTpl(tok) {
    var v = tok.v;
    if (v.indexOf('\n') === -1) return v;
    if (BRACE_TPL[tok.k]) return v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');
    if (tok.k === 'php' || tok.k === 'erb') return v;
    if (/(^|[^:])\/\//.test(v)) return v;
    return v.replace(/\s*\n\s*/g, ' ').replace(/[ \t]{2,}/g, ' ');
  }

  function isBlockBoundary(tok, level) {
    if (!tok) return true;
    if (tok.t === 'open') return !INLINE.has(tok.name);
    if (tok.t === 'close') return !INLINE.has(tok.name);
    if (tok.t === 'doctype') return true;
    if (tok.t === 'comment') return true;
    if (tok.t === 'condopen' || tok.t === 'condclose') return true;
    // control-flow template blocks behave like block elements on the top level
    if (tok.t === 'tpl' && level >= 3) {
      var c = classifyTpl(tok);
      return c === 'open' || c === 'close' || c === 'mid';
    }
    return false;
  }

  /**
   * level: 1 = safe, 2 = balanced, 3 = extreme
   */
  function minify(src, level) {
    level = level || 2;
    var toks = tokenize(src);
    var out = [];
    var opts = {
      lowercase: level >= 3,
      unquote: level >= 3,
      dropAttrs: level >= 3,
      dropSlash: level >= 3
    };

    // build list of significant tokens for whitespace context
    var keep = [];
    for (var i = 0; i < toks.length; i++) {
      var tk = toks[i];
      if (tk.t === 'comment' && level >= 2 && !tk.keep &&
          !/^<!--\[if/i.test(tk.v) && !/^<!--!/.test(tk.v) && !/^<!--\s*<!\[endif/i.test(tk.v)) {
        continue;
      }
      // merge adjacent text tokens (they appear once comments are dropped)
      var last = keep[keep.length - 1];
      if (tk.t === 'text' && last && last.t === 'text') { last.v += tk.v; continue; }
      keep.push(tk);
    }

    function prevSig(idx) { return idx > 0 ? keep[idx - 1] : null; }
    function nextSig(idx) { return idx < keep.length - 1 ? keep[idx + 1] : null; }

    for (var j = 0; j < keep.length; j++) {
      var t = keep[j];

      switch (t.t) {
        case 'doctype':
          out.push(t.v.replace(/\s+/g, ' ').trim());
          break;

        case 'condopen':
        case 'condclose':
          out.push(t.v.replace(/\s+/g, ' ').trim());
          break;

        case 'comment':
          out.push(t.v.replace(/\s*\n\s*/g, level >= 2 ? ' ' : '\n'));
          break;

        case 'open':
          out.push(openTag(t, opts));
          break;

        case 'close':
          out.push('</' + (opts.lowercase || HTML_TAGS.has(t.name) ? t.name : t.rawName) + '>');
          break;

        case 'tpl':
          out.push(level >= 2 ? collapseTpl(t) : t.v);
          break;

        case 'raw': {
          if (t.name === 'pre' || t.name === 'textarea') out.push(t.v);
          else if (t.name === 'style') out.push(level >= 2 ? minifyCSS(t.v) : minifyJS(t.v));
          else if (t.name === 'script') out.push(minifyJS(t.v));
          else out.push(t.v);
          break;
        }

        case 'text': {
          var v = t.v;
          var blank = !v.trim();
          var pB = isBlockBoundary(prevSig(j), level);
          var nB = isBlockBoundary(nextSig(j), level);

          // пробел у границы блочного элемента не отрисовывается — его можно убрать
          if (blank) {
            if (pB || nB) out.push(level === 1 ? '\n' : '');
            else out.push(' ');
            break;
          }
          var collapsed = v.replace(/\s+/g, ' ');
          if (pB) collapsed = collapsed.replace(/^ /, '');
          if (nB) collapsed = collapsed.replace(/ $/, '');
          out.push(collapsed);
          break;
        }
      }
    }

    var res = out.join('');
    if (level === 1) res = res.replace(/\n{2,}/g, '\n').replace(/^\s+|\s+$/g, '');
    else res = res.replace(/^\s+|\s+$/g, '');
    return res;
  }

  /* ---------------------------------------------------------- *
   * 9. Analyser (light validation surfaced in the status bar)
   * ---------------------------------------------------------- */

  function analyze(src) {
    var built = buildTree(tokenize(src));
    var w = built.warnings.slice();
    var seenIds = Object.create(null);

    (function walk(n) {
      if (n.type === 'el') {
        var attrs = n.tok.attrs, seen = Object.create(null);
        for (var i = 0; i < attrs.length; i++) {
          var a = attrs[i];
          if (a.tpl) continue;
          var ln = (a.name || '').toLowerCase();
          if (seen[ln]) w.push({ level: 'warn', msg: 'Дубль атрибута ' + a.name + ' в <' + n.name + '>' });
          seen[ln] = 1;
          if (ln === 'id' && a.value) {
            if (seenIds[a.value]) w.push({ level: 'warn', msg: 'Повтор id="' + a.value + '"' });
            seenIds[a.value] = 1;
          }
          if (a.value === '' && (ln === 'class' || ln === 'style' || ln === 'id')) {
            w.push({ level: 'info', msg: 'Пустой атрибут ' + a.name + ' в <' + n.name + '>' });
          }
        }
        if (n.name === 'img' && !attrs.some(function (a) { return !a.tpl && (a.name || '').toLowerCase() === 'alt'; })) {
          w.push({ level: 'info', msg: '<img> без alt' });
        }
      }
      (n.children || []).forEach(walk);
    })(built.root);

    return w;
  }

  /* ---------------------------------------------------------- *
   * 10. Проверка и починка тегов
   * ---------------------------------------------------------- */

  var BROKEN_CLOSE = /<\/([a-zA-Z][\w:.\-]*)/g;

  /**
   * Список проблем со скобками и парностью тегов.
   * Всё, что сюда попадает, умеет чинить repair().
   */
  function checkTags(src) {
    var items = [];
    var toks = tokenize(src);

    toks.forEach(function (t) {
      if (t.t === 'text') {
        // «</tr» без «>» токенайзер оставляет обычным текстом
        var m = t.v.match(BROKEN_CLOSE);
        if (m) m.forEach(function (x) {
          items.push({ level: 'err', msg: 'Пропущен «>»: ' + x + ' → ' + x + '>' });
        });
      }
      if (t.t === 'open' && t.unterminated) {
        items.push({ level: 'err', msg: 'Пропущен «>» у <' + t.name + '>' });
      }
    });

    buildTree(toks).warnings.forEach(function (w) {
      if (w.fix) items.push(w);
    });

    return items;
  }

  /**
   * Чинит скобки и парность тегов, затем форматирует.
   * Возвращает { code, fixes, warnings }.
   */
  function repair(src, options) {
    var fixes = [];
    var toks = tokenize(src);
    var rebuilt = '';
    var changed = false;

    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (t.t === 'text' && /<\/[a-zA-Z]/.test(t.v)) {
        rebuilt += t.v.replace(/<\/([a-zA-Z][\w:.\-]*)/g, function (m, name) {
          fixes.push({ level: 'fix', msg: 'Дописан «>»: </' + name + '>' });
          changed = true;
          return '</' + name + '>';
        });
        continue;
      }
      if (t.t === 'open' && t.unterminated) {
        fixes.push({ level: 'fix', msg: 'Дописан «>» у <' + t.name + '>' });
        changed = true;
      }
      rebuilt += tokenText(t, options);
    }

    var res = beautify(changed ? rebuilt : src,
      Object.assign({}, options || {}, { fix: true }));

    return {
      code: res.code,
      fixes: fixes.concat(res.fixes || []),
      warnings: res.warnings
    };
  }

  function tokenText(t, opts) {
    switch (t.t) {
      case 'open':  return openTag(t, opts || {});
      case 'close': return '</' + (t.rawName || t.name) + '>';
      case 'raw':   return t.v;
      default:      return t.v || '';
    }
  }

  return {
    tokenize: tokenize,
    beautify: beautify,
    minify: minify,
    analyze: analyze,
    checkTags: checkTags,
    repair: repair,
    VOID: VOID,
    INLINE: INLINE
  };
});
</script>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var input = $('input'), output = $('output');
  var level = 2;

  /* ---------------- темы ---------------- */
  var THEMES = [
    { id: 'alien',     word: 'Alien',     sub: 'фосфорный ЭЛТ',   ink: '#4dffa6', bg: '#070b09' },
    { id: 'vault',     word: 'Vault',     sub: 'янтарь убежища',  ink: '#ffb648', bg: '#0a0704' },
    { id: 'solaris',   word: 'Solaris',   sub: 'холодная станция',ink: '#7ad7ff', bg: '#050a0d' },
    { id: 'replicant', word: 'Replicant', sub: 'неоновый нуар',   ink: '#22d3ee', bg: '#0a0714' },
    { id: 'grid',      word: 'Grid',      sub: 'световая сетка',  ink: '#00e5ff', bg: '#000306' },
    { id: 'zion',      word: 'Zion',      sub: 'цифровой дождь',  ink: '#00ff41', bg: '#000600' },
    { id: 'monolith',  word: 'Monolith',  sub: 'дневная',         ink: '#16150f', bg: '#eceae4' }
  ];

  var themeId = localStorage.getItem('am.theme') || 'alien';
  if (!THEMES.some(function (t) { return t.id === themeId; })) themeId = 'alien';

  function current() {
    return THEMES.filter(function (t) { return t.id === themeId; })[0] || THEMES[0];
  }

  function favicon(t) {
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>" +
      "<rect width='32' height='32' rx='6' fill='" + t.bg + "'/>" +
      "<g fill='" + t.ink + "'>" +
      "<rect x='5' y='7' width='22' height='3.2' rx='1.6'/>" +
      "<rect x='10' y='14.4' width='17' height='3.2' rx='1.6'/>" +
      "<rect x='15' y='21.8' width='12' height='3.2' rx='1.6'/></g>" +
      "<rect x='5' y='21.8' width='3.2' height='3.2' rx='1' fill='" + t.ink + "' opacity='.45'/></svg>";
    return 'data:image/svg+xml,' + svg.replace(/#/g, '%23').replace(/</g, '%3C').replace(/>/g, '%3E');
  }

  function applyTheme(silent) {
    var t = current();
    document.documentElement.dataset.theme = t.id;
    localStorage.setItem('am.theme', t.id);
    $('brandName').textContent = t.word + ' Markup';
    $('themeLabel').textContent = t.id;
    $('themeChip').style.background = t.ink;
    document.title = t.word.toUpperCase() + ' MARKUP — форматтер и минификатор HTML';
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t.bg);
    document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function (l) {
      l.setAttribute('href', favicon(t));
    });
    Array.prototype.forEach.call($('themeMenu').children, function (b) {
      b.setAttribute('aria-current', b.dataset.id === t.id ? 'true' : 'false');
    });
    rain.sync();
    if (!silent) toast('оформление: ' + t.word);
  }

  $('themeMenu').innerHTML = THEMES.map(function (t) {
    return '<button role="menuitem" data-id="' + t.id + '">' +
      '<span class="chip" style="background:' + t.ink + '"></span>' + t.word +
      '<span class="sub">' + t.sub + '</span></button>';
  }).join('');

  $('themeMenu').addEventListener('click', function (e) {
    var b = e.target.closest('[data-id]');
    if (!b) return;
    themeId = b.dataset.id;
    applyTheme();
    closeMenu();
  });

  function openMenu() {
    $('themeMenu').classList.add('open');
    $('themeBtn').setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    $('themeMenu').classList.remove('open');
    $('themeBtn').setAttribute('aria-expanded', 'false');
  }
  $('themeBtn').onclick = function (e) {
    e.stopPropagation();
    if ($('themeMenu').classList.contains('open')) closeMenu(); else openMenu();
  };
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.palette')) closeMenu();
  });

  /* ---------------- цифровой дождь (тема zion) ---------------- */
  var rain = (function () {
    var cv = $('rain');
    var ctx = cv && cv.getContext ? cv.getContext('2d') : null;
    if (!ctx) return { sync: function () {} };
    var cols = [], size = 15, timer = null;
    var GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾅﾆﾇﾈﾊﾋﾎﾏﾐﾑﾒﾓﾔﾕﾗﾘﾜ0123456789<>/{}$@';

    function resize() {
      cv.width = window.innerWidth;
      cv.height = window.innerHeight;
      var n = Math.ceil(cv.width / size);
      cols = [];
      for (var i = 0; i < n; i++) cols.push(Math.random() * -60);
    }
    function frame() {
      ctx.fillStyle = 'rgba(0,0,0,.09)';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.font = size + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = '#00ff41';
      for (var i = 0; i < cols.length; i++) {
        var ch = GLYPHS[(Math.random() * GLYPHS.length) | 0];
        ctx.fillText(ch, i * size, cols[i] * size);
        if (cols[i] * size > cv.height && Math.random() > 0.975) cols[i] = 0;
        cols[i]++;
      }
    }
    window.addEventListener('resize', function () { if (timer) resize(); });
    return {
      sync: function () {
        var on = document.documentElement.dataset.theme === 'zion' &&
                 !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (on && !timer) { resize(); timer = setInterval(frame, 55); }
        else if (!on && timer) {
          clearInterval(timer); timer = null;
          ctx.clearRect(0, 0, cv.width, cv.height);
        }
      }
    };
  })();

  applyTheme(true);

  /* ---------------- counters ---------------- */
  var todayKey = new Date().toISOString().slice(0, 10);
  var stats = JSON.parse(localStorage.getItem('am.stats') || '{}');
  if (stats.date !== todayKey) { stats.date = todayKey; stats.today = 0; }
  stats.total = stats.total || 0;
  var session = 0;

  function paintStats() {
    $('stToday').textContent = stats.today || 0;
    $('stTotal').textContent = stats.total || 0;
    $('stSession').textContent = session;
  }
  function bump() {
    stats.today = (stats.today || 0) + 1;
    stats.total = (stats.total || 0) + 1;
    session++;
    localStorage.setItem('am.stats', JSON.stringify(stats));
    paintStats();
    if (window.AM_GLOBAL_COUNTER) window.AM_GLOBAL_COUNTER();
  }
  paintStats();

  /* ---------------- gutters ---------------- */
  function paintGutter(ta, gut) {
    var n = ta.value ? ta.value.split('\n').length : 1;
    if (n > 20000) n = 20000;
    var cached = gut.dataset.n | 0;
    if (cached !== n) {
      var s = '';
      for (var i = 1; i <= n; i++) s += i + '\n';
      gut.textContent = s;
      gut.dataset.n = n;
    }
    gut.scrollTop = ta.scrollTop;
  }
  function sync(ta, gut) {
    ta.addEventListener('scroll', function () { gut.scrollTop = ta.scrollTop; });
    ta.addEventListener('input', function () { paintGutter(ta, gut); });
  }
  sync(input, $('gutIn'));
  sync(output, $('gutOut'));

  function meta(text) {
    var chars = text.length;
    var lines = text ? text.split('\n').length : 0;
    return chars.toLocaleString('ru-RU') + ' симв · ' + lines.toLocaleString('ru-RU') + ' стр';
  }
  input.addEventListener('input', function () {
    $('inMeta').textContent = meta(input.value);
  });

  /* ---------------- toast ---------------- */
  var toastEl = $('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* ---------------- diagnostics ---------------- */
  function paintDiag(warnings) {
    var box = $('diag');
    $('stDiag').textContent = warnings.length;
    $('ledErr').classList.toggle('off', !warnings.length);
    if (!warnings.length) { box.classList.remove('show'); box.innerHTML = ''; return; }
    var TAGS = { err: 'ошибка', warn: 'внимание', fix: 'исправлено', info: 'заметка' };
    var html = warnings.slice(0, 60).map(function (w) {
      var tag = TAGS[w.level] || 'заметка';
      return '<div class="row lvl-' + w.level + '"><span class="tag">[' + tag + ']</span><span>' +
             esc(w.msg) + '</span></div>';
    }).join('');
    if (warnings.length > 60) html += '<div class="row lvl-info"><span class="tag"></span><span>… ещё ' + (warnings.length - 60) + '</span></div>';
    box.innerHTML = html; box.classList.add('show');
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* ---------------- actions ---------------- */
  function indentString() {
    var v = $('indentSel').value;
    return v === 'tab' ? '\t' : ' '.repeat(Number(v));
  }

  function run(mode) {
    var src = input.value;
    if (!src.trim()) { toast('буфер ввода пуст'); return; }
    var t0 = performance.now();
    var res, warnings;
    try {
      if (mode === 'format') {
        var r = AMEngine.beautify(src, { indent: indentString() });
        res = r.code; warnings = r.warnings.concat(AMEngine.analyze(src).filter(isExtra));
      } else {
        res = AMEngine.minify(src, level);
        warnings = AMEngine.analyze(src);
      }
    } catch (e) {
      $('stStatus').textContent = 'сбой парсера';
      toast('ошибка: ' + e.message);
      return;
    }
    var dt = (performance.now() - t0).toFixed(1);

    output.value = res;
    paintGutter(output, $('gutOut'));
    $('outMeta').textContent = meta(res);
    $('stMode').textContent = mode === 'format'
      ? 'формат / ' + ($('indentSel').value === 'tab' ? 'tab' : $('indentSel').value + 'sp')
      : 'сжатие L' + level;

    var delta = src.length ? Math.round((1 - res.length / src.length) * 100) : 0;
    $('stSave').textContent = (delta > 0 ? '−' + delta : (delta < 0 ? '+' + (-delta) : '0')) +
      '% · ' + fmtBytes(src.length - res.length);
    $('stStatus').textContent = 'готово за ' + dt + ' мс';
    paintDiag(dedupeWarn(warnings));
    bump();
  }

  function isExtra(w) { return w.level === 'info' || /Дубль|Повтор/.test(w.msg); }

  function dedupeWarn(list) {
    var seen = {}, out = [];
    list.forEach(function (w) {
      var k = w.level + '|' + w.msg;
      if (seen[k]) return; seen[k] = 1; out.push(w);
    });
    return out;
  }

  function fmtBytes(n) {
    var sign = n < 0 ? '+' : '';
    n = Math.abs(n);
    if (n < 1024) return sign + n + ' б';
    if (n < 1024 * 1024) return sign + (n / 1024).toFixed(1) + ' кб';
    return sign + (n / 1048576).toFixed(2) + ' мб';
  }

  $('btnFormat').onclick = function () { run('format'); };
  $('btnMinify').onclick = function () { run('minify'); };

  /* ---------------- проверка и починка тегов ---------------- */
  var scanTimer, lastScan = -1;

  function scanTags() {
    var src = input.value;
    if (!src.trim()) { paintFix(0); return; }
    if (src.length > 2 * 1024 * 1024) { paintFix(0); return; }
    var items;
    try { items = AMEngine.checkTags(src); } catch (e) { items = []; }
    paintFix(items.length);
  }

  function paintFix(n) {
    lastScan = n;
    $('btnFix').classList.toggle('alert', n > 0);
    $('fixCount').textContent = n;
    $('btnFix').title = n
      ? 'Найдено проблем: ' + n + '. Нажмите, чтобы дописать пропущенные теги и скобки'
      : 'Проблем с тегами не найдено';
  }

  input.addEventListener('input', function () {
    clearTimeout(scanTimer);
    scanTimer = setTimeout(scanTags, 350);
  });

  $('btnFix').onclick = function () {
    var src = input.value;
    if (!src.trim()) { toast('буфер ввода пуст'); return; }
    if (lastScan === 0) { toast('чинить нечего — теги в порядке'); return; }

    var t0 = performance.now();
    var res;
    try {
      res = AMEngine.repair(src, { indent: indentString() });
    } catch (e) {
      $('stStatus').textContent = 'сбой починки';
      toast('ошибка: ' + e.message);
      return;
    }
    var dt = (performance.now() - t0).toFixed(1);

    output.value = res.code;
    paintGutter(output, $('gutOut'));
    $('outMeta').textContent = meta(res.code);
    $('stMode').textContent = 'починка + формат';
    $('stSave').textContent = '—';
    $('stStatus').textContent = 'исправлено ' + res.fixes.length + ' за ' + dt + ' мс';
    // показываем, что сделано, плюс то, что чинить не умеем
    paintDiag(dedupeWarn(res.fixes.concat(
      res.warnings.filter(function (w) { return !w.fix; })
    )));
    bump();
    toast(res.fixes.length ? 'исправлено: ' + res.fixes.length : 'нечего исправлять');
  };

  $('levelSeg').addEventListener('click', function (e) {
    var t = e.target.closest('[data-lv]');
    if (!t) return;
    level = Number(t.dataset.lv);
    Array.prototype.forEach.call(this.children, function (c) {
      c.setAttribute('aria-selected', c === t ? 'true' : 'false');
    });
    if (output.value) run('minify');
  });

  $('btnSwap').onclick = function () {
    if (!output.value) { toast('нечего переносить'); return; }
    input.value = output.value;
    $('inMeta').textContent = meta(input.value);
    paintGutter(input, $('gutIn'));
    scanTags();
    toast('результат перенесён в ввод');
  };

  $('btnClear').onclick = function () {
    input.value = ''; output.value = '';
    $('inMeta').textContent = meta(''); $('outMeta').textContent = '—';
    paintGutter(input, $('gutIn')); paintGutter(output, $('gutOut'));
    paintDiag([]); paintFix(0); $('stStatus').textContent = 'буфер очищен';
    $('stSave').textContent = '—'; $('stMode').textContent = '—';
    input.focus();
  };

  $('btnCopy').onclick = function () {
    if (!output.value) { toast('буфер вывода пуст'); return; }
    navigator.clipboard.writeText(output.value).then(function () {
      toast('скопировано в буфер обмена');
    }, function () {
      output.select(); document.execCommand('copy'); toast('скопировано');
    });
  };

  $('btnDownload').onclick = function () {
    if (!output.value) { toast('буфер вывода пуст'); return; }
    var blob = new Blob([output.value], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'alien-markup-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.html';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('файл сохранён');
  };

  /* ---------------- drag & drop ---------------- */
  var dz = $('drop'), dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
    dragDepth++; dz.classList.add('show');
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dz.classList.remove('show');
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dz.classList.remove('show');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('файл больше 8 мб'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      input.value = String(fr.result);
      $('inMeta').textContent = meta(input.value);
      paintGutter(input, $('gutIn'));
      $('stStatus').textContent = 'загружен ' + f.name;
      scanTags();
      toast('загружен ' + f.name);
    };
    fr.readAsText(f);
  });

  /* ---------------- hotkeys ---------------- */
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter') { e.preventDefault(); run('format'); }
    if (mod && e.shiftKey && (e.key === 'M' || e.key === 'm')) { e.preventDefault(); run('minify'); }
    if (mod && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); $('btnCopy').click(); }
    if (mod && e.shiftKey && (e.key === 'F' || e.key === 'f')) { e.preventDefault(); $('btnFix').click(); }
    if (mod && e.shiftKey && (e.key === 'T' || e.key === 't')) {
      e.preventDefault();
      var i = THEMES.map(function (t) { return t.id; }).indexOf(themeId);
      themeId = THEMES[(i + 1) % THEMES.length].id;
      applyTheme();
    }
    if (e.key === 'Escape') closeMenu();
  });

  /* ---------------- sample ---------------- */
  var SAMPLE = [
    '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Каталог</title>',
    '<!-- шапка страницы,',
    '     не трогать без причины --></head>',
    '<body class="page   dark"><div class="wrap"><header class="hdr"><a href="/" class="logo">ACME</a>',
    '@if($user)<span class="hi">Привет, {{ $user->name }}!</span>@else<a href="/login">Войти</a>@endif',
    '</header>',
    '{% for item in items %}<article class="card" data-id="{{ item.id }}"><h2>{{ item.title }}</h2>',
    '<p>Цена: <b>${{ item.price }}</b> <em>со скидкой</em></p>',
    '<?php if ($item->isNew()): ?><span class="badge">NEW</span><?php endif; ?>',
    '</article>{% else %}<p class="empty">Ничего не найдено</p>{% endfor %}',
    '<% if admin? %><a href="/admin">Панель</a><% end %>',
    '<img src="/i/x.png" alt=""><input type=text disabled="disabled" class="">',
    '<pre>  сохраняем\n  как есть</pre>',
    '<script type="text/javascript">',
    '      function boot(){ return `${window.name} @{tpl}`; }',
    '<\/script>',
    '</div></body></html>'
  ].join('\n');

  $('btnSample').onclick = function () {
    input.value = SAMPLE;
    $('inMeta').textContent = meta(input.value);
    paintGutter(input, $('gutIn'));
    scanTags();
    run('format');
  };

  /* ---------------- boot sequence ---------------- */
  var BOOT = [
    current().word.toUpperCase() + ' MARKUP // UNIT 2.1',
    '----------------------------------------',
    'CORE MEMORY ............ 640K OK',
    'TOKENIZER .............. LOADED',
    'TREE BUILDER ........... LOADED',
    'COMPRESSOR ............. L1 / L2 / L3',
    'TEMPLATE DRIVERS ....... BLADE · TWIG · JINJA · ERB · PHP · MUSTACHE · ${} · @{}',
    '----------------------------------------',
    'CTRL+ENTER .... форматировать',
    'CTRL+SHIFT+M .. сжать',
    'CTRL+SHIFT+C .. копировать результат',
    'CTRL+SHIFT+F .. починить теги',
    'CTRL+SHIFT+T .. следующее оформление',
    '',
    'ОЖИДАНИЕ ВВОДА ▮'
  ];
  (function bootSeq() {
    var i = 0;
    (function step() {
      if (i >= BOOT.length) { $('stStatus').textContent = 'готов'; return; }
      output.value += (i ? '\n' : '') + BOOT[i++];
      paintGutter(output, $('gutOut'));
      setTimeout(step, 55);
    })();
  })();

  paintGutter(input, $('gutIn'));
  paintFix(0);
  input.focus();
})();
</script>
</body>
</html>
