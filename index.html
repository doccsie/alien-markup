      sync: function () {
        var on = document.documentElement.dataset.theme === 'zion' &&
                 !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (on && !timer) { resize(); timer = setInterval(frame, 55); }
        else if (!on && timer) {
          clearInterval(timer); timer = null;
          ctx.clearRect(0, 0, cv.width, cv.height);
        }
      }
    };
  })();

  applyTheme(true);

  /* ---------------- counters ---------------- */
  var todayKey = new Date().toISOString().slice(0, 10);
  var stats = JSON.parse(localStorage.getItem('am.stats') || '{}');
  if (stats.date !== todayKey) { stats.date = todayKey; stats.today = 0; }
  stats.total = stats.total || 0;
  var session = 0;

  function paintStats() {
    $('stToday').textContent = stats.today || 0;
    $('stTotal').textContent = stats.total || 0;
    $('stSession').textContent = session;
  }
  function bump() {
    stats.today = (stats.today || 0) + 1;
    stats.total = (stats.total || 0) + 1;
    session++;
    localStorage.setItem('am.stats', JSON.stringify(stats));
    paintStats();
    if (window.AM_GLOBAL_COUNTER) window.AM_GLOBAL_COUNTER();
  }
  paintStats();

  /* ---------------- gutters ---------------- */
  function paintGutter(ta, gut) {
    var n = ta.value ? ta.value.split('\n').length : 1;
    if (n > 20000) n = 20000;
    var key = String(n);
    if (gut.dataset.key !== key) {
      var out = [];
      for (var i = 1; i <= n; i++) out.push(i);
      gut.innerHTML = out.join('\n');
      gut.dataset.key = key;
    }
    gut.scrollTop = ta.scrollTop;
  }

  function sync(ta, gut) {
    ta.addEventListener('scroll', function () { gut.scrollTop = ta.scrollTop; });
    ta.addEventListener('input', function () { paintGutter(ta, gut); });
  }
  sync(input, $('gutIn'));
  sync(output, $('gutOut'));

  function meta(text) {
    var chars = text.length;
    var lines = text ? text.split('\n').length : 0;
    return chars.toLocaleString('ru-RU') + ' симв · ' + lines.toLocaleString('ru-RU') + ' стр';
  }
  input.addEventListener('input', function () {
    $('inMeta').textContent = meta(input.value);
  });

  /* ---------------- toast ---------------- */
  var toastEl = $('toast'), toastTimer;
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1700);
  }

  /* ---------------- diagnostics ---------------- */
  function paintDiag(warnings) {
    var box = $('diag');
    $('stDiag').textContent = warnings.length;
    $('ledErr').classList.toggle('off', !warnings.length);
    if (!warnings.length) { box.classList.remove('show'); box.innerHTML = ''; return; }
    var TAGS = { err: 'ошибка', warn: 'внимание', fix: 'исправлено', info: 'заметка' };
    var html = warnings.slice(0, 60).map(function (w) {
      var tag = TAGS[w.level] || 'заметка';
      return '<div class="row lvl-' + w.level + '"><span class="tag">[' + tag + ']</span><span>' +
             esc(w.msg) + '</span></div>';
    }).join('');
    if (warnings.length > 60) html += '<div class="row lvl-info"><span class="tag"></span><span>… ещё ' + (warnings.length - 60) + '</span></div>';
    box.innerHTML = html; box.classList.add('show');
  }
  function esc(s) {
    return String(s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }

  /* ---------------- actions ---------------- */
  function indentString() {
    var v = $('indentSel').value;
    return v === 'tab' ? '\t' : ' '.repeat(Number(v));
  }

  /* ---------------- типографика ---------------- */
  var typoOn = localStorage.getItem('am.typo') === '1';
  $('typoOn').checked = typoOn;
  $('typoOn').addEventListener('change', function () {
    typoOn = this.checked;
    localStorage.setItem('am.typo', typoOn ? '1' : '0');
    toast('типографика ' + (typoOn ? 'включена' : 'выключена'));
    if (output.value && lastMode) run(lastMode);
  });

  // Применяется перед любой обработкой: и к форматированию, и к сжатию, и к починке.
  function preprocess(src, stat) {
    if (!typoOn) return src;
    try {
      var r = AMEngine.typography(src);
      stat.typo = r.count;
      return r.code;
    } catch (e) { return src; }
  }

  var lastMode = null;

  function run(mode) {
    var src = input.value;
    if (!src.trim()) { toast('буфер ввода пуст'); return; }
    lastMode = mode;
    var stat = { typo: 0 };
    src = preprocess(src, stat);
    var t0 = performance.now();
    var res, warnings;
    try {
      if (mode === 'format') {
        var r = AMEngine.beautify(src, { indent: indentString() });
        res = r.code; warnings = r.warnings.concat(AMEngine.analyze(src).filter(isExtra));
      } else {
        res = AMEngine.minify(src, level);
        warnings = AMEngine.analyze(src);
      }
    } catch (e) {
      $('stStatus').textContent = 'сбой парсера';
      toast('ошибка: ' + e.message);
      return;
    }
    var dt = (performance.now() - t0).toFixed(1);

    output.value = res;
    paintGutter(output, $('gutOut'));
    $('outMeta').textContent = meta(res);
    $('stMode').textContent = (mode === 'format'
      ? 'формат / ' + ($('indentSel').value === 'tab' ? 'tab' : $('indentSel').value + 'sp')
      : 'сжатие L' + level) + (typoOn ? ' + типо' : '');

    var delta = src.length ? Math.round((1 - res.length / src.length) * 100) : 0;
    $('stSave').textContent = (delta > 0 ? '−' + delta : (delta < 0 ? '+' + (-delta) : '0')) +
      '% · ' + fmtBytes(src.length - res.length);
    $('stStatus').textContent = 'готово за ' + dt + ' мс' +
      (stat.typo ? ' · типографика: ' + stat.typo : '');
    paintDiag(dedupeWarn(warnings));
    bump();
  }

  function isExtra(w) { return w.level === 'info' || /Дубль|Повтор/.test(w.msg); }

  function dedupeWarn(list) {
    var seen = {}, out = [];
    list.forEach(function (w) {
      var k = w.level + '|' + w.msg;
      if (seen[k]) return; seen[k] = 1; out.push(w);
    });
    return out;
  }

  function fmtBytes(n) {
    var sign = n < 0 ? '+' : '';
    n = Math.abs(n);
    if (n < 1024) return sign + n + ' б';
    if (n < 1024 * 1024) return sign + (n / 1024).toFixed(1) + ' кб';
    return sign + (n / 1048576).toFixed(2) + ' мб';
  }

  $('btnFormat').onclick = function () { run('format'); };
  $('btnMinify').onclick = function () { run('minify'); };

  $('levelSeg').addEventListener('click', function (e) {
    var t = e.target.closest('[data-lv]');
    if (!t) return;
    level = Number(t.dataset.lv);
    Array.prototype.forEach.call(this.children, function (c) {
      c.setAttribute('aria-selected', c === t ? 'true' : 'false');
    });
    if (output.value) run('minify');
  });

  $('btnSwap').onclick = function () {
    if (!output.value) { toast('нечего переносить'); return; }
    input.value = output.value;
    $('inMeta').textContent = meta(input.value);
    paintGutter(input, $('gutIn'));
    toast('результат перенесён в ввод');
  };

  $('btnClear').onclick = function () {
    input.value = ''; output.value = '';
    $('inMeta').textContent = meta(''); $('outMeta').textContent = '—';
    paintGutter(input, $('gutIn')); paintGutter(output, $('gutOut'));
    paintDiag([]); $('stStatus').textContent = 'буфер очищен';
    $('stSave').textContent = '—'; $('stMode').textContent = '—';
    input.focus();
  };

  $('btnCopy').onclick = function () {
    if (!output.value) { toast('буфер вывода пуст'); return; }
    navigator.clipboard.writeText(output.value).then(function () {
      toast('скопировано в буфер обмена');
    }, function () {
      output.select(); document.execCommand('copy'); toast('скопировано');
    });
  };

  $('btnDownload').onclick = function () {
    if (!output.value) { toast('буфер вывода пуст'); return; }
    var blob = new Blob([output.value], { type: 'text/html;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'alien-markup-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.html';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('файл сохранён');
  };

  /* ---------------- drag & drop ---------------- */
  var dz = $('drop'), dragDepth = 0;
  window.addEventListener('dragenter', function (e) {
    if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') === -1) return;
    dragDepth++; dz.classList.add('show');
  });
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('dragleave', function () {
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) dz.classList.remove('show');
  });
  window.addEventListener('drop', function (e) {
    e.preventDefault(); dragDepth = 0; dz.classList.remove('show');
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    if (f.size > 8 * 1024 * 1024) { toast('файл больше 8 мб'); return; }
    var fr = new FileReader();
    fr.onload = function () {
      input.value = String(fr.result);
      $('inMeta').textContent = meta(input.value);
      paintGutter(input, $('gutIn'));
      $('stStatus').textContent = 'загружен ' + f.name;
      toast('загружен ' + f.name);
    };
    fr.readAsText(f);
  });

  /* ---------------- hotkeys ---------------- */
  document.addEventListener('keydown', function (e) {
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key === 'Enter') { e.preventDefault(); run('format'); }
    if (mod && e.shiftKey && (e.key === 'M' || e.key === 'm')) { e.preventDefault(); run('minify'); }
    if (mod && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); $('btnCopy').click(); }
    if (mod && e.shiftKey && (e.key === 'T' || e.key === 't')) {
      e.preventDefault();
      var i = THEMES.map(function (t) { return t.id; }).indexOf(themeId);
      themeId = THEMES[(i + 1) % THEMES.length].id;
      applyTheme();
    }
    if (e.key === 'Escape') closeMenu();
  });

  /* ---------------- sample ---------------- */
  var SAMPLE = [
    '<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><title>Каталог</title>',
    '<!-- шапка страницы,',
    '     не трогать без причины --></head>',
    '<body class="page   dark"><div class="wrap"><header class="hdr"><a href="/" class="logo">ACME</a>',
    '@if($user)<span class="hi">Привет, {{ $user->name }}!</span>@else<a href="/login">Войти</a>@endif',
    '</header>',
    '{% for item in items %}<article class="card" data-id="{{ item.id }}"><h2>{{ item.title }}</h2>',
    '<p>Цена: <b>${{ item.price }}</b> <em>со скидкой</em></p>',
    '<?php if ($item->isNew()): ?><span class="badge">NEW</span><?php endif; ?>',
    '</article>{% else %}<p class="empty">Ничего не найдено</p>{% endfor %}',
    '<% if admin? %><a href="/admin">Панель</a><% end %>',
    '<img src="/i/x.png" alt=""><input type=text disabled="disabled" class="">',
    '<pre>  сохраняем\n  как есть</pre>',
    '<script type="text/javascript">',
    '      function boot(){ return `${window.name} @{tpl}`; }',
    '<\/script>',
    '</div></body></html>'
  ].join('\n');

  $('btnSample').onclick = function () {
    input.value = SAMPLE;
    $('inMeta').textContent = meta(input.value);
    paintGutter(input, $('gutIn'));
    run('format');
  };

  /* ---------------- boot sequence ---------------- */
  var BOOT = [
    current().word.toUpperCase() + ' MARKUP // UNIT 2.1',
    '----------------------------------------',
    'CORE MEMORY ............ 640K OK',
    'TOKENIZER .............. LOADED',
    'TREE BUILDER ........... LOADED',
    'COMPRESSOR ............. L1 / L2 / L3',
    'TEMPLATE DRIVERS ....... BLADE · TWIG · JINJA · ERB · PHP · MUSTACHE · ${} · @{}',
    '----------------------------------------',
    'CTRL+ENTER .... форматировать',
    'CTRL+SHIFT+M .. сжать',
    'CTRL+SHIFT+C .. копировать результат',
    'CTRL+SHIFT+T .. следующее оформление',
    '',
    'ОЖИДАНИЕ ВВОДА ▮'
  ];
  (function bootSeq() {
    var i = 0;
    (function step() {
      if (i >= BOOT.length) { $('stStatus').textContent = 'готов'; return; }
      output.value += (i ? '\n' : '') + BOOT[i++];
      paintGutter(output, $('gutOut'));
      setTimeout(step, 55);
    })();
  })();

  paintGutter(input, $('gutIn'));
  input.focus();
})();
</script>
</body>
</html>
